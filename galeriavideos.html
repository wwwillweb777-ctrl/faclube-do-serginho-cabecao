<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Vídeos — Fã Clube Serginho Cabeção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* ===== CABEÇALHO ===== */
        .cabecalho {
            position: sticky;
            top: 0;
            background: #000;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }
        .btn-voltar {
            position: absolute;
            left: 1rem;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        .cabecalho h1 {
            color: #f4a900;
            font-size: 1.2rem;
        }

        /* ===== GRADE DE VÍDEOS ===== */
        .grade-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
            max-width: 520px;
            margin: 0 auto;
        }
        .card-video {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 9/16;
            cursor: pointer;
        }
        .capa-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #fff;
            opacity: 0.8;
        }
        .video-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 0.8rem;
        }
        .video-info h4 { font-size: 0.85rem; margin-bottom: 2px; }

        /* ===== TELA DO VÍDEO ===== */
        .video-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 999;
            display: none;
            flex-direction: row;
        }
        .video-screen.active { display: flex; }

        .video-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .video-player {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        .video-player video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ⏸️ BOTÃO PAUSA/PLAY NO CENTRO DO VÍDEO */
        .play-pause-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            font-size: 48px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .play-pause-btn.visivel {
            opacity: 1;
        }
        .play-pause-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        .video-bottom-info {
            padding: 16px;
            padding-bottom: 80px;
        }
        .video-bottom-info h3 {
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .video-bottom-info p {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.4;
        }
        .close-video {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
        }

        /* ===== BOTÕES VERTICAIS ===== */
        .actions-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            padding: 20px 12px;
            justify-content: flex-end;
            padding-bottom: 120px;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.9); }
        .action-btn span:first-child { font-size: 30px; }
        .action-btn span:last-child { font-size: 12px; }

        .like-btn.liked span:first-child {
            color: #fe2c55;
            filter: drop-shadow(0 0 4px #fe2c55);
        }

        /* ===== ABA DE COMENTÁRIOS ===== */
        .comments-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            top: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }
        .comments-overlay.active { display: block; }
        .comments-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #121212;
            border-radius: 16px 16px 0 0;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .comments-overlay.active .comments-panel {
            transform: translateY(0);
        }
        .comments-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .comments-header h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .close-comments {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }
        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .comment-item {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #222;
        }
        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f4a900, #fe2c55);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .comment-content { flex: 1; min-width: 0; }
        .comment-author {
            font-size: 0.85rem;
            color: #f4a900;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .comment-text {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .comment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .comment-time {
            font-size: 0.75rem;
            color: #666;
        }
        .delete-comment-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .delete-comment-btn:hover {
            color: #ff4444;
            background: rgba(255,68,68,0.1);
        }
        .empty-comments {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 0.9rem;
        }

        /* Área de envio */
        .comments-input-area {
            padding: 12px 16px 20px;
            border-top: 1px solid #2a2a2a;
        }
        .name-input-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .name-input-wrapper input,
        .comment-input-wrapper input {
            flex: 1;
            background: #2a2a2a;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .name-input-wrapper input:focus,
        .comment-input-wrapper input:focus {
            background: #333;
        }
        .comment-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .comment-input-wrapper button {
            background: #fe2c55;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .comment-input-wrapper button:hover {
            background: #e0264b;
        }
        .hint-text {
            font-size: 0.75rem;
            color: #555;
            margin-top: 6px;
            padding-left: 4px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="cabecalho">
        <button class="btn-voltar" onclick="window.location.href='index.html'">← Voltar</button>
        <h1>🎬 Vídeos do Fã Clube</h1>
    </div>

    <!-- GRADE DE VÍDEOS -->
    <div class="grade-videos" id="gradeVideos"></div>

    <!-- TELA DO VÍDEO -->
    <div class="video-screen" id="videoScreen">
        <div class="video-left">
            <button class="close-video" onclick="fecharVideo()">×</button>
            <div class="video-player" id="videoPlayerContainer">
                <!-- ⏸️ BOTÃO PAUSA/PLAY -->
                <button class="play-pause-btn" id="playPauseBtn" onclick="alternarPlayPause()">⏸️</button>
                <video id="playerVideo" playsinline loop></video>
            </div>
            <div class="video-bottom-info">
                <h3 id="videoTitulo"></h3>
                <p id="videoDescricao"></p>
            </div>
        </div>

        <!-- ✅ SÓ CURTIR E COMENTAR -->
        <div class="actions-right">
            <button class="action-btn like-btn" id="likeBtn" onclick="toggleCurtir()">
                <span>❤️</span>
                <span id="likeCount">0</span>
            </button>
            <button class="action-btn comment-btn" onclick="abrirComentarios()">
                <span>💬</span>
                <span id="commentCount">0</span>
            </button>
        </div>
    </div>

    <!-- ABA DE COMENTÁRIOS -->
    <div class="comments-overlay" id="commentsOverlay" onclick="if(event.target === this) fecharComentarios()">
        <div class="comments-panel">
            <div class="comments-header">
                <h4>Comentários — <span id="totalComentarios">0</span></h4>
                <button class="close-comments" onclick="fecharComentarios()">✕</button>
            </div>
            <div class="comments-list" id="commentsList">
                <div class="empty-comments">
                    Seja o primeiro a comentar! ✨
                </div>
            </div>
            <div class="comments-input-area">
                <div class="name-input-wrapper">
                    <input type="text" id="nameInput" placeholder="Seu nome (opcional)" maxlength="20">
                </div>
                <div class="comment-input-wrapper">
                    <input type="text" id="commentInput" placeholder="Escreva seu comentário..." maxlength="200">
                    <button onclick="enviarComentario()">Publicar</button>
                </div>
                <p class="hint-text">Se não colocar nome, será usado seu ID de visitante</p>
            </div>
        </div>
    </div>

    <!-- 📦 Importar Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // ==================================================
        // 🔥 CONFIGURAÇÃO DO FIREBASE
        // Projeto: Fã Clube do Serginho Cabeção
        // ==================================================
        const firebaseConfig = {
          apiKey: "AIzaSyAROBYhE8GLFyJ3vrqkVYAa383pKAI88Yg",
          authDomain: "faclubeserginho-e0c8e.firebaseapp.com",
          databaseURL: "https://faclubeserginho-e0c8e-default-rtdb.firebaseio.com",
          projectId: "faclubeserginho-e0c8e",
          storageBucket: "faclubeserginho-e0c8e.firebasestorage.app",
          messagingSenderId: "871956894909",
          appId: "1:871956894909:web:a35251e63afb5166b993d4"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==================================================
        // 🆓 GERAR OU OBTER ID DO USUÁRIO
        // ==================================================
        function gerarOuObterUsuarioId() {
          let userId = localStorage.getItem('usuarioId');
          if (!userId) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let parte1 = '', parte2 = '';
            for (let i = 0; i < 4; i++) {
              parte1 += chars.charAt(Math.floor(Math.random() * chars.length));
              parte2 += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            userId = `${parte1}-${parte2}`;
            localStorage.setItem('usuarioId', userId);
          }
          return userId;
        }
        const MEU_USUARIO_ID = gerarOuObterUsuarioId();

        // ==================================================
        // 📋 DADOS DOS VÍDEOS
const videos = [
    {
        id: 1,
        capa: "imagens/capa-biografia.jpg",
        arquivo: "videos/BiografiaSerginho.mp4",
        titulo: "📖 Biografia do Serginho",
        descricao: "Conheça a história do nosso querido Serginho Cabeção! 💛"
    },
    {
        id: 2,
        capa: "imagens/capa-goku.jpg",
        arquivo: "videos/SerginhoGoku.mp4",
        titulo: "🐉 Serginho e Goku",
        descricao: "Um vídeo especial do Serginho! ⚡"
    }
];

let videoAtual = null;
let curtidasRef = null;
let comentariosRef = null;
let inscritoCurtidas = null;
let inscritoComentarios = null;

// 🖼️ Montar grade
const grade = document.getElementById('gradeVideos');
videos.forEach(video => {
    const card = document.createElement('div');
    card.className = 'card-video';
    card.onclick = () => abrirVideo(video.id);
    card.innerHTML = `
        <img src="${video.capa}" class="capa-img" alt="${video.titulo}">
        <span class="play-icon">▶</span>
        <div class="video-info">
            <h4>${video.titulo}</h4>
        </div>
    `;
    grade.appendChild(card);
});

// ▶️ Abrir vídeo e conectar em tempo real
function abrirVideo(id) {
    videoAtual = id;
    const video = videos.find(v => v.id === id);
    
    document.getElementById('videoTitulo').textContent = video.titulo;
    document.getElementById('videoDescricao').textContent = video.descricao;
    
    const player = document.getElementById('playerVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    
    player.src = video.arquivo;
    player.loop = true;
    player.load();
    
    document.getElementById('videoScreen').classList.add('active');
    
    player.play().then(() => {
        playPauseBtn.textContent = '⏸️';
        playPauseBtn.classList.remove('visivel');
    }).catch(() => {
        playPauseBtn.textContent = '▶️';
        playPauseBtn.classList.add('visivel');
    });

    // 🔄 Conectar ao Firebase — TEMPO REAL
    conectarDadosVideo(id);
}

// 🔄 Conectar e escutar alterações em tempo real
function conectarDadosVideo(videoId) {
    // Cancela inscrições anteriores
    if (inscritoCurtidas) inscritoCurtidas.off();
    if (inscritoComentarios) inscritoComentarios.off();

    curtidasRef = db.ref(`videos/${videoId}/curtidas`);
    comentariosRef = db.ref(`videos/${videoId}/comentarios`);

    // Inicializar se não existir
    curtidasRef.once('value').then(snap => {
        if (!snap.exists()) curtidasRef.set({ total: 0, usuarios: {} });
    });

    // 👀 Escutar CURTIDAS em tempo real — TODOS veem ao mesmo tempo
    inscritoCurtidas = curtidasRef.on('value', snap => {
        const dados = snap.val() || { total: 0, usuarios: {} };
        const likeBtn = document.getElementById('likeBtn');
        document.getElementById('likeCount').textContent = dados.total || 0;
        
        const euCurti = dados.usuarios && dados.usuarios[MEU_USUARIO_ID] === true;
        if (euCurti) {
            likeBtn.classList.add('liked');
        } else {
            likeBtn.classList.remove('liked');
        }
    });

    // 👀 Escutar COMENTÁRIOS em tempo real — TODOS veem ao mesmo tempo
    inscritoComentarios = comentariosRef.on('value', snap => {
        const dados = snap.val() || {};
        const listaComentarios = Object.values(dados);
        const total = listaComentarios.length;
        
        document.getElementById('commentCount').textContent = total;
        document.getElementById('totalComentarios').textContent = total;
        
        renderizarComentarios(listaComentarios);
    });
}

// ⏸️ Play / Pausa
function alternarPlayPause() {
    const player = document.getElementById('playerVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    
    if (player.paused) {
        player.play();
        playPauseBtn.textContent = '⏸️';
        playPauseBtn.classList.remove('visivel');
    } else {
        player.pause();
        playPauseBtn.textContent = '▶️';
        playPauseBtn.classList.add('visivel');
        setTimeout(() => {
            if (player.paused) playPauseBtn.classList.remove('visivel');
        }, 3000);
    }
}

// ✖️ Fechar vídeo
function fecharVideo() {
    const player = document.getElementById('playerVideo');
    player.pause();
    player.src = '';
    document.getElementById('videoScreen').classList.remove('active');
    fecharComentarios();
    
    // Para de escutar quando fechar
    if (inscritoCurtidas) inscritoCurtidas.off();
    if (inscritoComentarios) inscritoComentarios.off();
    videoAtual = null;
}

// ❤️ Curtir / Descurtir — salva no Firebase
function toggleCurtir() {
    if (!videoAtual || !curtidasRef) return;
    
    curtidasRef.once('value').then(snap => {
        const dados = snap.val() || { total: 0, usuarios: {} };
        const jaCurtiu = dados.usuarios && dados.usuarios[MEU_USUARIO_ID];
        
        if (jaCurtiu) {
            dados.total--;
            delete dados.usuarios[MEU_USUARIO_ID];
        } else {
            dados.total++;
            if (!dados.usuarios) dados.usuarios = {};
            dados.usuarios[MEU_USUARIO_ID] = true;
        }
        curtidasRef.set(dados);
    });
}

// 📝 Renderizar comentários na tela
function renderizarComentarios(listaComentarios) {
    const lista = document.getElementById('commentsList');
    
    if (listaComentarios.length === 0) {
        lista.innerHTML = '<div class="empty-comments">Seja o primeiro a comentar! ✨</div>';
        return;
    }

    lista.innerHTML = listaComentarios.map(c => {
        const ehMeu = c.autorId === MEU_USUARIO_ID;
        const nomeExibido = c.nome || `ID: ${c.autorId}`;
        
        return `
            <div class="comment-item">
                <div class="comment-avatar">${nomeExibido.charAt(0).toUpperCase()}</div>
                <div class="comment-content">
                    <div class="comment-author">${nomeExibido}</div>
                    <div class="comment-text">${c.texto}</div>
                    <div class="comment-meta">
                        <span class="comment-time">${c.data}</span>
                        ${ehMeu ? `<button class="delete-comment-btn" onclick="apagarComentario('${c.chave}')">🗑️ Apagar</button>` : ''}
                    </div>
                </div>
            </div>
        `;
    }).reverse().join('');
}

// 💬 Abrir comentários
function abrirComentarios() {
    if (!videoAtual) return;
    document.getElementById('commentsOverlay').classList.add('active');
}

// ✖️ Fechar comentários
function fecharComentarios() {
    document.getElementById('commentsOverlay').classList.remove('active');
    document.getElementById('nameInput').value = '';
    document.getElementById('commentInput').value = '';
}

// ✉️ Enviar comentário — vai para o Firebase, TODOS veem na hora
function enviarComentario() {
    const nomeInput = document.getElementById('nameInput');
    const commentInput = document.getElementById('commentInput');
    const nome = nomeInput.value.trim();
    const texto = commentInput.value.trim();
    
    if (!texto || !videoAtual || !comentariosRef) return;

    const novoComentarioRef = comentariosRef.push();
    novoComentarioRef.set({
        chave: novoComentarioRef.key,
        texto: texto,
        nome: nome || null,
        autorId: MEU_USUARIO_ID,
        data: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' — ' + 
              new Date().toLocaleDateString('pt-BR')
    });

    nomeInput.value = '';
    commentInput.value = '';
}

// 🗑️ Apagar comentário — SÓ funciona se for SEU comentário
function apagarComentario(chave) {
    if (!videoAtual || !comentariosRef) return;
    
    comentariosRef.child(chave).once('value').then(snap => {
        const comentario = snap.val();
        if (comentario && comentario.autorId === MEU_USUARIO_ID) {
            comentariosRef.child(chave).remove();
        } else {
            alert('Você só pode apagar seus próprios comentários ✅');
        }
    });
}

// ⌨️ Enter envia comentário
document.getElementById('commentInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') enviarComentario();
});
</script>

</body>
</html>
