<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Vídeos — Fã Clube Serginho Cabeção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* ===== CABEÇALHO ===== */
        .cabecalho {
            position: sticky;
            top: 0;
            background: #000;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }
        .btn-voltar {
            position: absolute;
            left: 1rem;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-voltar span {
            font-size: 1.1rem;
        }
        .cabecalho h1 {
            color: #f4a900;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== GRADE DE VÍDEOS ===== */
        .grade-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 16px;
            max-width: 520px;
            margin: 0 auto;
        }

        .card-video {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.25s ease;
        }
        .card-video:active {
            transform: scale(0.97);
            border-color: #f4a900;
        }

        /* Área da capa com botão de play */
        .capa-container {
            position: relative;
            aspect-ratio: 9/16;
            background: #222;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .capa-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }
        .botao-play {
            position: relative;
            z-index: 2;
            width: 80px;
            height: 80px;
            background: #fe2c55;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 0 25px rgba(254, 44, 85, 0.5);
            transition: all 0.2s;
        }
        .capa-container:hover .botao-play {
            transform: scale(1.08);
        }
        .duracao {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 2;
        }
        .fixado-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff0000;
            color: #fff;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 2;
        }
        .numero-video {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #f4a900;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 2;
        }

        /* Informações abaixo da capa */
        .info-card {
            padding: 12px;
        }
        .info-card h3 {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .info-card p {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
        }

        /* ===== TELA DO VÍDEO INCORPORADO ===== */
        .tela-video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.97);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 1rem;
            overflow-y: auto;
        }
        .tela-video-overlay.visivel {
            display: flex;
        }
        .fechar-tela {
            align-self: flex-end;
            background: #111;
            border: 2px solid #f4a900;
            color: #f4a900;
            font-size: 1rem;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            z-index: 10;
            margin-bottom: 1rem;
        }
        .embed-container {
            width: 100%;
            max-width: 360px;
        }
        .embed-container blockquote {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
        }
        .descricao-video-grande {
            width: 100%;
            max-width: 360px;
            padding: 1rem;
            text-align: center;
        }
        .descricao-video-grande h3 {
            color: #f4a900;
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }
        .descricao-video-grande p {
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="cabecalho">
        <button class="btn-voltar" onclick="if(document.referrer) { history.back(); } else { window.location.href='index.html'; } return false;">
            <span>←</span> Voltar
        </button>
        <h1>🎬 Vídeos do Fã Clube</h1>
    </div>

    <!-- GRADE DE VÍDEOS -->
    <div class="grade-videos" id="gradeVideos"></div>

    <!-- TELA DO VÍDEO INCORPORADO -->
    <div class="tela-video-overlay" id="telaVideoGrande">
        <button class="fechar-tela" onclick="fecharVideo()">✖️ Fechar</button>
        <div class="embed-container" id="containerEmbed"></div>
        <div class="descricao-video-grande">
            <h3 id="tituloVideoGrande">Título do Vídeo</h3>
            <p id="descricaoVideoGrande">Descrição do Vídeo</p>
        </div>
    </div>

    <script>
        // ==================================================
        // 📋 LISTA DOS VÍDEOS — JÁ COM OS CAMINHOS CORRETOS!
        // ==================================================
        const videos = [
            // 🎬 VÍDEO 1 — TikTok
            {
                numero: 1,
                capa: "imagens/capa-video1.jpg",
                tipo: "tiktok",
                embedHtml: `<blockquote class="tiktok-embed" cite="https://vt.tiktok.com/ZSgGopwbw/" data-video-id="ZSgGopwbw" style="max-width: 605px;min-width: 325px;">
    <section>
        <a target="_blank" title="Fã clube do Serginho cabeção" href="https://www.tiktok.com/@serginhocabecao/video/ZSgGopwbw">Fã clube do Serginho cabeção</a>
        <p>Juntos nós somos mais fortes. 🤠😎😃🏆</p>
        <p>🎵 Te Levar Daqui - Charlie Brown Jr.</p>
    </section>
</blockquote>`,
                titulo: "🤠 Juntos nós somos mais fortes",
                descricao: "Assista direto aqui no site! ❤️ Curtidas e 💬 comentários funcionando!",
                duracao: "TikTok",
                fixado: true
            },
            // 🎬 VÍDEO 2 — Arquivo de vídeo local
            {
                numero: 2,
                capa: "imagens/capa-biografia.jpg",
                tipo: "local",
                arquivo: "videos/BiografiaSerginho.mp4",
                titulo: "📖 Biografia do Serginho",
                descricao: "Conheça a história do nosso querido Serginho Cabeção!",
                duracao: "0:00",
                fixado: false
            },
            // 🎬 VÍDEO 3 — Arquivo de vídeo local
            {
                numero: 3,
                capa: "imagens/capa-goku.jpg",
                tipo: "local",
                arquivo: "videos/SerginhoGoku.mp4",
                titulo: "🐉 Serginho e Goku",
                descricao: "Um vídeo especial do Serginho!",
                duracao: "0:00",
                fixado: false
            }
        ];

        // 🖼️ MONTA A GRADE
        const grade = document.getElementById('gradeVideos');
        videos.forEach(video => {
            const card = document.createElement('div');
            card.className = 'card-video';
            card.innerHTML = `
                <div class="capa-container" onclick="abrirVideo(${video.numero})">
                    ${video.fixado ? '<span class="fixado-tag">📌 Fixado</span>' : ''}
                    <span class="numero-video">#${video.numero}</span>
                    <img src="${video.capa}" alt="Vídeo ${video.numero}" class="capa-img" loading="lazy">
                    <span class="botao-play">▶</span>
                    <span class="duracao">${video.duracao}</span>
                </div>
                <div class="info-card">
                    <h3>${video.titulo}</h3>
                    <p>${video.descricao}</p>
                </div>
            `;
            grade.appendChild(card);
        });

        // ▶️ ABRE O VÍDEO
        function abrirVideo(numero) {
            const video = videos.find(v => v.numero === numero);
            const overlay = document.getElementById('telaVideoGrande');
            const containerEmbed = document.getElementById('containerEmbed');
            const tituloEl = document.getElementById('tituloVideoGrande');
            const descricaoEl = document.getElementById('descricaoVideoGrande');
            
            tituloEl.textContent = video.titulo;
            descricaoEl.textContent = video.descricao;
            
            // Limpa o conteúdo anterior
            containerEmbed.innerHTML = '';
            
            if (video.tipo === 'tiktok') {
                // 📱 Vídeo do TikTok — incorporado
                containerEmbed.innerHTML = video.embedHtml;
                
                // Carrega o script do TikTok se ainda não carregou
                if (!window.tiktokEmbedLoaded) {
                    window.tiktokEmbedLoaded = true;
                    const script = document.createElement('script');
                    script.src = 'https://www.tiktok.com/embed.js';
                    script.async = true;
                    document.head.appendChild(script);
                }
            } else {
                // 🎬 Vídeo local (.mp4)
                containerEmbed.innerHTML = `<video id="playerVideo" controls playsinline webkit-playsinline style="width:100%; border-radius:8px; background:#000;"></video>`;
                const player = document.getElementById('playerVideo');
                player.src = video.arquivo;
                player.play();
            }
            
            overlay.classList.add('visivel');
            document.body.style.overflow = 'hidden';
        }

        // ✕ FECHA O VÍDEO
        function fecharVideo() {
            const overlay = document.getElementById('telaVideoGrande');
            const containerEmbed = document.getElementById('containerEmbed');
            const player = document.getElementById('playerVideo');
            
            if (player) {
                player.pause();
                player.src = '';
            }
            containerEmbed.innerHTML = '';
            overlay.classList.remove('visivel');
            document.body.style.overflow = 'auto';
        }

        // ⌨️ Tecla ESC fecha o vídeo
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') fecharVideo();
        });
    </script>
</body>
</html>
