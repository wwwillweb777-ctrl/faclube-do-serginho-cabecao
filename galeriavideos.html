<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Vídeos — Fã Clube Serginho Cabeção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* ===== CABEÇALHO ===== */
        .cabecalho {
            position: sticky;
            top: 0;
            background: #000;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }
        .btn-voltar {
            position: absolute;
            left: 1rem;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-voltar span { font-size: 1.1rem; }
        .cabecalho h1 {
            color: #f4a900;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== GRADE DE VÍDEOS ===== */
        .grade-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 16px;
            max-width: 520px;
            margin: 0 auto;
        }
        .card-video {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .card-video:active {
            transform: scale(0.97);
            border-color: #f4a900;
        }
        .capa-container {
            position: relative;
            aspect-ratio: 9/16;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .capa-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }
        .botao-play {
            position: relative;
            z-index: 2;
            width: 80px;
            height: 80px;
            background: #fe2c55;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 0 25px rgba(254, 44, 85, 0.5);
            transition: all 0.2s;
        }
        .capa-container:hover .botao-play { transform: scale(1.08); }
        .duracao {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 2;
        }
        .fixado-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff0000;
            color: #fff;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 2;
        }
        .numero-video {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #f4a900;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 2;
        }
        .info-card { padding: 12px; }
        .info-card h3 {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .info-card p {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
        }

        /* ===== TELA DO VÍDEO ===== */
        .tela-video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.97);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 1rem;
            overflow-y: auto;
        }
        .tela-video-overlay.visivel { display: flex; }
        .fechar-tela {
            align-self: flex-end;
            background: #111;
            border: 2px solid #f4a900;
            color: #f4a900;
            font-size: 1rem;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            z-index: 10;
            margin-bottom: 1rem;
        }
        .video-container {
            width: 100%;
            max-width: 360px;
        }
        .video-container video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }

        /* ===== AÇÕES: CURTIR E COMENTAR ===== */
        .acoes-video {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-around;
            padding: 1rem 0;
            border-bottom: 1px solid #333;
        }
        .botao-acao {
            background: transparent;
            border: none;
            color: #ccc;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .botao-acao span { font-size: 1.3rem; }
        .botao-acao.curtido { color: #fe2c55; }
        .botao-acao:hover { transform: scale(1.05); }

        /* ===== COMENTÁRIOS ===== */
        .area-comentarios {
            width: 100%;
            max-width: 360px;
            padding: 1rem 0;
        }
        .area-comentarios h4 {
            color: #f4a900;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }
        .lista-comentarios {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        .comentario {
            background: #1a1a1a;
            padding: 0.7rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }
        .comentario strong { color: #f4a900; }
        .comentario small { color: #666; font-size: 0.75rem; display: block; margin-top: 2px; }
        .caixa-comentario {
            display: flex;
            gap: 8px;
        }
        .caixa-comentario input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 0.6rem 0.8rem;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .caixa-comentario input:focus { border-color: #f4a900; }
        .caixa-comentario button {
            background: #f4a900;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 0 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .caixa-comentario button:hover { background: #e09800; }

        .descricao-video {
            width: 100%;
            max-width: 360px;
            padding: 0.5rem 1rem 1rem;
            text-align: center;
        }
        .descricao-video h3 {
            color: #f4a900;
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }
        .descricao-video p {
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="cabecalho">
        <button class="btn-voltar" onclick="if(document.referrer) { history.back(); } else { window.location.href='index.html'; } return false;">
            <span>←</span> Voltar
        </button>
        <h1>🎬 Vídeos do Fã Clube</h1>
    </div>

    <!-- GRADE DE VÍDEOS -->
    <div class="grade-videos" id="gradeVideos"></div>

    <!-- TELA DO VÍDEO -->
    <div class="tela-video-overlay" id="telaVideoGrande">
        <button class="fechar-tela" onclick="fecharVideo()">✖️ Fechar</button>
        
        <div class="video-container">
            <video id="playerVideo" controls playsinline webkit-playsinline></video>
        </div>

        <div class="descricao-video">
            <h3 id="tituloVideoGrande">Título do Vídeo</h3>
            <p id="descricaoVideoGrande">Descrição do Vídeo</p>
        </div>

        <!-- CURTIR E COMENTAR -->
        <div class="acoes-video">
            <button class="botao-acao" id="btnCurtir" onclick="curtirVideo()">
                <span>❤️</span>
                <span id="contadorCurtidas">0</span>
            </button>
            <button class="botao-acao" onclick="document.getElementById('inputComentario').focus()">
                <span>💬</span> Comentar
            </button>
        </div>

        <!-- COMENTÁRIOS -->
        <div class="area-comentarios">
            <h4>💬 Comentários (<span id="qtdComentarios">0</span>)</h4>
            <div class="lista-comentarios" id="listaComentarios">
                <p style="color:#666; font-size:0.85rem; text-align:center; padding:1rem;">Seja o primeiro a comentar! ✨</p>
            </div>
            <div class="caixa-comentario">
                <input type="text" id="inputComentario" placeholder="Escreva seu comentário..." maxlength="150">
                <button onclick="adicionarComentario()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // ==================================================
        // 📋 LISTA DOS VÍDEOS — SÓ OS 2 VÍDEOS LOCAIS
        // ==================================================
        const videos = [
            {
                numero: 1,
                capa: "imagens/capa-biografia.jpg",
                arquivo: "videos/BiografiaSerginho.mp4",
                titulo: "📖 Biografia do Serginho",
                descricao: "Conheça a história do nosso querido Serginho Cabeção!",
                duracao: "0:00",
                fixado: true
            },
            {
                numero: 2,
                capa: "imagens/capa-goku.jpg",
                arquivo: "videos/SerginhoGoku.mp4",
                titulo: "🐉 Serginho e Goku",
                descricao: "Um vídeo especial do Serginho!",
                duracao: "0:00",
                fixado: false
            }
        ];

        // 📊 DADOS: Curtidas e Comentários (salvos no navegador)
        let videoAtual = null;
        let curtidas = {};
        let curtido = {};
        let comentarios = {};

        // Carrega dados salvos
        function carregarDados() {
            const dadosSalvos = localStorage.getItem('dadosVideos');
            if (dadosSalvos) {
                const d = JSON.parse(dadosSalvos);
                curtidas = d.curtidas || {};
                curtido = d.curtido || {};
                comentarios = d.comentarios || {};
            }
        }
        function salvarDados() {
            localStorage.setItem('dadosVideos', JSON.stringify({ curtidas, curtido, comentarios }));
        }

        // 🖼️ MONTA A GRADE
        const grade = document.getElementById('gradeVideos');
        videos.forEach(video => {
            curtidas[video.numero] = curtidas[video.numero] || 0;
            curtido[video.numero] = curtido[video.numero] || false;
            comentarios[video.numero] = comentarios[video.numero] || [];

            const card = document.createElement('div');
            card.className = 'card-video';
            card.innerHTML = `
                <div class="capa-container" onclick="abrirVideo(${video.numero})">
                    ${video.fixado ? '<span class="fixado-tag">📌 Fixado</span>' : ''}
                    <span class="numero-video">#${video.numero}</span>
                    <img src="${video.capa}" alt="Vídeo ${video.numero}" class="capa-img" loading="lazy">
                    <span class="botao-play">▶</span>
                    <span class="duracao">${video.duracao}</span>
                </div>
                <div class="info-card">
                    <h3>${video.titulo}</h3>
                    <p>${video.descricao}</p>
                </div>
            `;
            grade.appendChild(card);
        });

        // ▶️ ABRE O VÍDEO
        function abrirVideo(numero) {
            carregarDados();
            videoAtual = numero;
            const video = videos.find(v => v.numero === numero);
            const overlay = document.getElementById('telaVideoGrande');
            const player = document.getElementById('playerVideo');
            
            document.getElementById('tituloVideoGrande').textContent = video.titulo;
            document.getElementById('descricaoVideoGrande').textContent = video.descricao;
            
            player.src = video.arquivo;
            overlay.classList.add('visivel');
            document.body.style.overflow = 'hidden';
            player.play();

            atualizarInterface();
        }

        // ❤️ CURTIR
        function curtirVideo() {
            if (!videoAtual) return;
            if (curtido[videoAtual]) {
                curtidas[videoAtual]--;
                curtido[videoAtual] = false;
            } else {
                curtidas[videoAtual]++;
                curtido[videoAtual] = true;
            }
            salvarDados();
            atualizarInterface();
        }

        // 💬 ADICIONAR COMENTÁRIO
        function adicionarComentario() {
            const input = document.getElementById('inputComentario');
            const texto = input.value.trim();
            if (!texto || !videoAtual) return;

            comentarios[videoAtual].unshift({
                texto: texto,
                data: new Date().toLocaleString('pt-BR')
            });
            input.value = '';
            salvarDados();
            atualizarInterface();
        }

        // 🔄 ATUALIZA A INTERFACE
        function atualizarInterface() {
            if (!videoAtual) return;

            // Curtir
            const btnCurtir = document.getElementById('btnCurtir');
            document.getElementById('contadorCurtidas').textContent = curtidas[videoAtual];
            if (curtido[videoAtual]) {
                            btnCurtir.classList.remove('curtido');
        }

        // Comentários
        const lista = document.getElementById('listaComentarios');
        const qtd = document.getElementById('qtdComentarios');
        qtd.textContent = comentarios[videoAtual].length;

        if (comentarios[videoAtual].length === 0) {
            lista.innerHTML = '<p style="color:#666; font-size:0.85rem; text-align:center; padding:1rem;">Seja o primeiro a comentar! ✨</p>';
        } else {
            lista.innerHTML = comentarios[videoAtual].map(c => `
                <div class="comentario">
                    <strong>Visitante</strong>
                    <p>${c.texto}</p>
                    <small>${c.data}</small>
                </div>
            `).join('');
        }
    }

    // ✕ FECHA O VÍDEO
    function fecharVideo() {
        const overlay = document.getElementById('telaVideoGrande');
        const player = document.getElementById('playerVideo');
        
        player.pause();
        player.src = '';
        overlay.classList.remove('visivel');
        document.body.style.overflow = 'auto';
        videoAtual = null;
    }

    // ⌨️ Tecla ENTER envia comentário
    document.getElementById('inputComentario').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') adicionarComentario();
    });

    // ⌨️ Tecla ESC fecha o vídeo
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') fecharVideo();
    });

    carregarDados();
</script>
</body>
</html>
