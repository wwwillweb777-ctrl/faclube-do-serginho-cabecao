<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Vídeos — Fã Clube Serginho Cabeção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* ===== CABEÇALHO ===== */
        .cabecalho {
            position: sticky;
            top: 0;
            background: #000;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }
        .btn-voltar {
            position: absolute;
            left: 1rem;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        .cabecalho h1 {
            color: #f4a900;
            font-size: 1.2rem;
        }

        /* ===== GRADE DE VÍDEOS ===== */
        .grade-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
            max-width: 520px;
            margin: 0 auto;
        }
        .card-video {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 9/16;
            cursor: pointer;
        }
        .capa-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #fff;
            opacity: 0.8;
        }
        .video-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 0.8rem;
        }
        .video-info h4 { font-size: 0.85rem; margin-bottom: 2px; }

        /* ===== TELA DO VÍDEO — ESTILO TIKTOK ===== */
        .video-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 999;
            display: none;
            flex-direction: row;
        }
        .video-screen.active { display: flex; }

        /* Lado esquerdo: Vídeo + Info */
        .video-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .video-player {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .video-player video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .video-bottom-info {
            padding: 16px;
            padding-bottom: 80px;
        }
        .video-bottom-info h3 {
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .video-bottom-info p {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.4;
        }
        .close-video {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        /* Lado direito: Botões verticais — IGUAL TIKTOK */
        .actions-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 20px 12px;
            justify-content: flex-end;
            padding-bottom: 100px;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.9); }
        .action-btn span:first-child { font-size: 28px; }
        .action-btn span:last-child { font-size: 11px; }

        /* Botão Curtir */
        .like-btn.liked span:first-child {
            color: #fe2c55;
            filter: drop-shadow(0 0 4px #fe2c55);
        }

        /* Botão Salvar */
        .save-btn.saved span:first-child {
            color: #ffd000;
            filter: drop-shadow(0 0 4px #ffd000);
        }

        /* ===== ABA DE COMENTÁRIOS — IGUAL TIKTOK ===== */
        .comments-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            top: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }
        .comments-overlay.active { display: block; }
        .comments-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #121212;
            border-radius: 16px 16px 0 0;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .comments-overlay.active .comments-panel {
            transform: translateY(0);
        }
        .comments-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .comments-header h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .close-comments {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }
        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .comment-item {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #3a3a3a;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .comment-content { flex: 1; }
        .comment-author {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        .comment-text {
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .comment-meta {
            font-size: 0.75rem;
            color: #666;
            display: flex;
            gap: 12px;
        }
        .comment-like-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .comment-like-btn.liked { color: #fe2c55; }
        .comments-input-area {
            padding: 12px 16px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .comments-input-area input {
            flex: 1;
            background: #2a2a2a;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .comments-input-area button {
            background: none;
            border: none;
            color: #fe2c55;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 8px 12px;
        }
        .empty-comments {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="cabecalho">
        <button class="btn-voltar" onclick="window.location.href='index.html'">← Voltar</button>
        <h1>🎬 Vídeos do Fã Clube</h1>
    </div>

    <!-- GRADE DE VÍDEOS -->
    <div class="grade-videos" id="gradeVideos"></div>

    <!-- TELA DO VÍDEO -->
    <div class="video-screen" id="videoScreen">
        <div class="video-left">
            <button class="close-video" onclick="fecharVideo()">×</button>
            <div class="video-player">
                <video id="playerVideo" playsinline></video>
            </div>
            <div class="video-bottom-info">
                <h3 id="videoTitulo"></h3>
                <p id="videoDescricao"></p>
            </div>
        </div>

        <!-- BOTÕES VERTICAIS — IGUAL TIKTOK -->
        <div class="actions-right">
            <!-- Curtir -->
            <button class="action-btn like-btn" id="likeBtn" onclick="toggleCurtir()">
                <span>❤️</span>
                <span id="likeCount">0</span>
            </button>
            <!-- Comentário -->
            <button class="action-btn comment-btn" onclick="abrirComentarios()">
                <span>💬</span>
                <span id="commentCount">0</span>
            </button>
            <!-- Salvar -->
            <button class="action-btn save-btn" id="saveBtn" onclick="toggleSalvar()">
                <span>📌</span>
                <span id="saveText">Salvar</span>
            </button>
            <!-- Compartilhar -->
            <button class="action-btn share-btn">
                <span>↗️</span>
                <span>Compartilhar</span>
            </button>
        </div>
    </div>

    <!-- ABA DE COMENTÁRIOS -- DESLIZA DE BAIXO PRA CIMA -->
    <div class="comments-overlay" id="commentsOverlay" onclick="if(event.target === this) fecharComentarios()">
        <div class="comments-panel">
            <div class="comments-header">
                <h4>Comentários — <span id="totalComentarios">0</span></h4>
                <button class="close-comments" onclick="fecharComentarios()">✕</button>
            </div>
            <div class="comments-list" id="commentsList">
                <div class="empty-comments">
                    Seja o primeiro a comentar! ✨
                </div>
            </div>
            <div class="comments-input-area">
                <input type="text" id="commentInput" placeholder="Adicione um comentário...">
                <button onclick="enviarComentario()">Publicar</button>
            </div>
        </div>
    </div>

    <script>
        // ==================================================
        // 📋 DADOS DOS VÍDEOS
        // ==================================================
        const videos = [
            {
                id: 1,
                capa: "imagens/capa-biografia.jpg",
                arquivo: "videos/BiografiaSerginho.mp4",
                titulo: "📖 Biografia do Serginho",
                descricao: "Conheça a história do nosso querido Serginho Cabeção! 💛"
            },
            {
                id: 2,
                capa: "imagens/capa-goku.jpg",
                arquivo: "videos/SerginhoGoku.mp4",
                titulo: "🐉 Serginho e Goku",
                descricao: "Um vídeo especial do Serginho! ⚡"
            }
        ];

        // 📊 DADOS SALVOS
        let videoAtual = null;
        let curtidas = {};
        let curtido = {};
        let salvos = {};
        let comentarios = {};

        // Carregar dados
        function carregarDados() {
            const dados = localStorage.getItem('dadosVideos');
            if (dados) {
                const d = JSON.parse(dados);
                curtidas = d.curtidas || {};
                curtido = d.curtido || {};
                salvos = d.salvos || {};
                comentarios = d.comentarios || {};
            }
            videos.forEach(v => {
                if (!curtidas[v.id]) curtidas[v.id] = 0;
                if (!curtido[v.id]) curtido[v.id] = false;
                if (!salvos[v.id]) salvos[v.id] = false;
                if (!comentarios[v.id]) comentarios[v.id] = [];
            });
        }
        function salvarDados() {
            localStorage.setItem('dadosVideos', JSON.stringify({ curtidas, curtido, salvos, comentarios }));
        }

        // 🖼️ Montar grade
        const grade = document.getElementById('gradeVideos');
        videos.forEach(video => {
            const card = document.createElement('div');
            card.className = 'card-video';
            card.onclick = () => abrirVideo(video.id);
            card.innerHTML = `
                <img src="${video.capa}" class="capa-img" alt="${video.titulo}">
                <span class="play-icon">▶</span>
                <div class="video-info">
                    <h4>${video.titulo}</h4>
                </div>
            `;
            grade.appendChild(card);
        });

        // ▶️ Abrir vídeo
        function abrirVideo(id) {
            carregarDados();
            videoAtual = id;
            const video = videos.find(v => v.id === id);
            
            document.getElementById('videoTitulo').textContent = video.titulo;
            document.getElementById('videoDescricao').textContent = video.descricao;
            document.getElementById('playerVideo').src = video.arquivo;
            document.getElementById('videoScreen').classList.add('active');
            document.getElementById('playerVideo').play();
            
            atualizarBotoes();
        }

        // ✖️ Fechar vídeo
        function fecharVideo() {
            document.getElementById('playerVideo').pause();
            document.getElementById('playerVideo').src = '';
            document.getElementById('videoScreen').classList.remove('active');
            fecharComentarios();
            videoAtual = null;
        }

        // ❤️ Curtir
        function toggleCurtir() {
            if (!videoAtual) return;
            if (curtido[videoAtual]) {
                curtidas[videoAtual]--;
                curtido[videoAtual] = false;
            } else {
                curtidas[videoAtual]++;
                curtido[videoAtual] = true;
            }
            salvarDados();
            atualizarBotoes();
        }

        // 📌 Salvar
        function toggleSalvar() {
                if (!videoAtual) return;
    salvos[videoAtual] = !salvos[videoAtual];
    salvarDados();
    atualizarBotoes();
}

// 🔄 Atualizar botões na tela
function atualizarBotoes() {
    if (!videoAtual) return;

    // Curtir
    const likeBtn = document.getElementById('likeBtn');
    document.getElementById('likeCount').textContent = curtidas[videoAtual];
    if (curtido[videoAtual]) {
        likeBtn.classList.add('liked');
    } else {
        likeBtn.classList.remove('liked');
    }

    // Salvar
    const saveBtn = document.getElementById('saveBtn');
    const saveText = document.getElementById('saveText');
    if (salvos[videoAtual]) {
        saveBtn.classList.add('saved');
        saveText.textContent = 'Salvo';
    } else {
        saveBtn.classList.remove('saved');
        saveText.textContent = 'Salvar';
    }

    // Comentários
    document.getElementById('commentCount').textContent = comentarios[videoAtual].length;
    document.getElementById('totalComentarios').textContent = comentarios[videoAtual].length;
}

// 💬 Abrir aba de comentários
function abrirComentarios() {
    if (!videoAtual) return;
    document.getElementById('commentsOverlay').classList.add('active');
    atualizarListaComentarios();
}

// ✖️ Fechar comentários
function fecharComentarios() {
    document.getElementById('commentsOverlay').classList.remove('active');
    document.getElementById('commentInput').value = '';
}

// 📝 Atualizar lista de comentários
function atualizarListaComentarios() {
    if (!videoAtual) return;
    const lista = document.getElementById('commentsList');
    const listaComentarios = comentarios[videoAtual];

    if (listaComentarios.length === 0) {
        lista.innerHTML = '<div class="empty-comments">Seja o primeiro a comentar! ✨</div>';
        return;
    }

    lista.innerHTML = listaComentarios.map((c, index) => `
        <div class="comment-item">
            <div class="comment-avatar">👤</div>
            <div class="comment-content">
                <div class="comment-author">Visitante</div>
                <div class="comment-text">${c.texto}</div>
                <div class="comment-meta">
                    <span>${c.data}</span>
                    <button class="comment-like-btn" id="curtir-comentario-${index}" onclick="curtirComentario(${index})">
                        ❤️ ${c.curtidas || 0}
                    </button>
                </div>
            </div>
        </div>
    `).reverse().join('');
}

// ✉️ Enviar comentário
function enviarComentario() {
    const input = document.getElementById('commentInput');
    const texto = input.value.trim();
    if (!texto || !videoAtual) return;

    comentarios[videoAtual].push({
        texto: texto,
        data: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' — ' + 
              new Date().toLocaleDateString('pt-BR'),
        curtidas: 0,
        curtido: false
    });

    input.value = '';
    salvarDados();
    atualizarListaComentarios();
    atualizarBotoes();
}

// ❤️ Curtir comentário
function curtirComentario(index) {
    if (!videoAtual) return;
    const comentario = comentarios[videoAtual][index];
    if (!comentario.curtido) {
        comentario.curtidas = (comentario.curtidas || 0) + 1;
        comentario.curtido = true;
    } else {
        comentario.curtidas = Math.max(0, (comentario.curtidas || 0) - 1);
        comentario.curtido = false;
    }
    salvarDados();
    atualizarListaComentarios();
}

// ⌨️ Enter envia comentário
document.getElementById('commentInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') enviarComentario();
});

carregarDados();
</script>
</body>
</html>
