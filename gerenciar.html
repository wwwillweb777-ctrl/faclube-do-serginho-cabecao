<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa — Fã Clube do Serginho Cabeção</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f8f8f8;
            background-image: radial-gradient(#d4d4d4 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .escondido { display: none !important; }

        .caixa-login {
            background: #000;
            border: 6px solid #f4a900;
            border-radius: 24px;
            padding: 2.5rem 1.8rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #f4a900;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .subtitulo {
            color: #ffcc00;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .campo-senha {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .campo-senha input {
            width: 100%;
            padding: 1rem 3.5rem 1rem 1.2rem;
            background: #1a1a1a;
            border: 3px solid #f4a900;
            border-radius: 12px;
            font-size: 1rem;
            color: #fff;
            outline: none;
        }

        .botao-macaco {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .aviso-erro {
            color: #ff6b6b;
            background: #2c1515;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #ef5350;
        }

        .btn-entrar {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, #f4a900, #ffcc00);
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            margin-bottom: 1.5rem;
        }

        .link-voltar {
            color: #f4a900;
            text-decoration: none;
            font-size: 1rem;
        }

        .caixa-painel {
            background: #000;
            border: 4px solid #f4a900;
            border-radius: 20px;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            min-height: 80vh;
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .cabecalho h2 {
            color: #f4a900;
            font-size: 1.3rem;
        }

        .btn-sair {
            background: linear-gradient(90deg, #e53935, #f4511e);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .abas {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .aba {
            flex: 1;
            padding: 0.7rem;
            background: #222;
            border: 2px solid #444;
            border-radius: 10px;
            color: #aaa;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .aba.ativa {
            background: #f4a900;
            border-color: #ffcc00;
            color: #000;
        }

        .bloco-mensagem {
            background: #111;
            border: 2px solid #f4a900;
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .msg-cabecalho {
            background: linear-gradient(90deg, #f4a900, #ffcc00);
            color: #000;
            padding: 0.6rem 1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .msg-conteudo {
            padding: 1rem;
            color: #ddd;
            line-height: 1.5;
        }

        .msg-botoes {
            padding: 0 1rem 1rem;
        }

        .btn-apagar {
            width: 100%;
            padding: 0.6rem;
            background: linear-gradient(90deg, #ef5350, #e53935);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-limpar-tudo {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(90deg, #ef5350, #e53935);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        .vazio {
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="telaLogin" class="caixa-login">
        <h1>🔐 Área Administrativa</h1>
        <p class="subtitulo">Fã Clube do Serginho Cabeção</p>

        <div class="campo-senha">
            <input type="password" id="campoSenha" placeholder="Digite a senha..." autocomplete="off">
            <button type="button" class="botao-macaco" id="botaoOlho">🙈</button>
        </div>

        <p id="avisoErro" class="aviso-erro escondido">❌ Senha incorreta!</p>

        <button class="btn-entrar" id="botaoEntrar">🔐 Entrar</button>

        <a href="javascript:history.back()" class="link-voltar">← ← Voltar para o Mural de Fãs</a>
    </div>

    <div id="telaPainel" class="caixa-painel escondido">
        <div class="cabecalho">
            <h2>📋 Painel de Controle</h2>
            <button class="btn-sair" id="botaoSair">🚪 Sair</button>
        </div>

        <div class="abas">
            <div class="aba ativa" id="abaMural">📋 Mural de Fãs</div>
            <div class="aba" id="abaApoio">💪 Mensagens de Apoio</div>
        </div>

        <div id="conteudoMural">
            <div id="listaMural"></div>
            <button class="btn-limpar-tudo" id="btnLimparMural">🗑️ Limpar Mural Completo</button>
        </div>

        <div id="conteudoApoio" class="escondido">
            <div id="listaApoio"></div>
            <button class="btn-limpar-tudo" id="btnLimparApoio">🗑️ Limpar Mensagens de Apoio</button>
        </div>

        <a href="javascript:history.back()" class="link-voltar" style="margin-top: 2rem; display: inline-block;">← ← Voltar para o Mural de Fãs</a>
    </div>

    <script>
        const CAMINHO_MURAL = "Mural";
        const CAMINHO_APOIO = "MensagensApoio";

        let db = null;
        let abaAtual = 'mural';
        let ouvinteMural = null;
        let ouvinteApoio = null;

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }

        let senhaVisivel = false;
        const campoSenha = document.getElementById('campoSenha');
        const botaoOlho = document.getElementById('botaoOlho');
        const avisoErro = document.getElementById('avisoErro');

        botaoOlho.addEventListener('click', function() {
            senhaVisivel = !senhaVisivel;
            campoSenha.type = senhaVisivel ? 'text' : 'password';
            botaoOlho.textContent = senhaVisivel ? '🙉' : '🙈';
        });

        document.getElementById('botaoEntrar').addEventListener('click', function() {
            const digitada = campoSenha.value.trim();
            if (digitada.toLowerCase() === SENHA_ADMIN.toLowerCase()) {
                document.getElementById('telaLogin').classList.add('escondido');
                document.getElementById('telaPainel').classList.remove('escondido');
                carregarMural();
            } else {
                avisoErro.classList.remove('escondido');
                campoSenha.value = '';
            }
        });

        document.getElementById('botaoSair').addEventListener('click', function() {
            pararOuvirTudo();
            if (confirm("Sair da área administrativa?")) {
                document.getElementById('telaPainel').classList.add('escondido');
                document.getElementById('telaLogin').classList.remove('escondido');
                avisoErro.classList.add('escondido');
                campoSenha.value = '';
                senhaVisivel = false;
                abaAtual = 'mural';
            }
        });

        function pararOuvirMural() {
            if (ouvinteMural && db) {
                db.ref(CAMINHO_MURAL).off("value", ouvinteMural);
                ouvinteMural = null;
            }
        }

        function pararOuvirApoio() {
            if (ouvinteApoio && db) {
                db.ref(CAMINHO_APOIO).off("value", ouvinteApoio);
                ouvinteApoio = null;
            }
        }

        function pararOuvirTudo() {
            pararOuvirMural();
            pararOuvirApoio();
        }

        document.getElementById('abaMural').addEventListener('click', function() {
            trocarAba('mural');
        });
        document.getElementById('abaApoio').addEventListener('click', function() {
            trocarAba('apoio');
        });

        function trocarAba(aba) {
            abaAtual = aba;
            document.getElementById('abaMural').classList.toggle('ativa', aba === 'mural');
            document.getElementById('abaApoio').classList.toggle('ativa', aba === 'apoio');
            document.getElementById('conteudoMural').classList.toggle('escondido', aba !== 'mural');
            document.getElementById('conteudoApoio').classList.toggle('escondido', aba !== 'apoio');
            if (aba === 'mural') carregarMural();
            if (aba === 'apoio') carregarApoio();
        }

        function carregarMural() {
            if (!db) {
                document.getElementById('listaMural').innerHTML = 
                    '<div class="vazio"><p>⚠️ Firebase não conectado. Verifique o config.js</p></div>';
                return;
            }

            pararOuvirMural();
            ouvinteMural = db.ref(CAMINHO_MURAL).on("value", function(snap) {
                const dados = snap.val() || {};
                const container = document.getElementById('listaMural');
                container.innerHTML = '';

                if (!snap.exists()) {
                    container.innerHTML = '<div class="vazio"><p>📭 Nenhuma mensagem no Mural ainda</p></div>';
                    return;
                }

                const chaves = Object.keys(dados).reverse();
                chaves.forEach(function(chave) {
                    const msg = dados[chave];
                    const div = document.createElement('div');
                    div.className = 'bloco-mensagem';
                    div.innerHTML = `
                        <div class="msg-cabecalho">
                            📝 Mensagem
                            <span style="font-size:0.75rem;">${chave.substring(0, 8)}...</span>
                        </div>
                        <div class="msg-conteudo">${msg.texto || msg}</div>
                        <div class="msg-botoes">
                            <button class="btn-apagar" data-tipo="mural" data-chave="${chave}">🗑️ Apagar Esta Mensagem</button>
                        </div>
                    `;
                    container.appendChild(div);
                });

                document.querySelectorAll('[data-tipo="mural"]').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        if (confirm('Apagar esta mensagem?')) {
                            const chave = this.getAttribute('data-chave');
                            db.ref(`${CAMINHO_MURAL}/${chave}`).remove();
                        }
                    });
                });
            });
        }

        function carregarApoio() {
            if (!db) return;

            pararOuvirApoio();
            ouvinteApoio = db.ref(CAMINHO_APOIO).on("value", function(snap) {
                const dados = snap.val() || {};
                const container = document.getElementById('listaApoio');
                container.innerHTML = '';

                if (!snap.exists()) {
                    container.innerHTML = '<div class="vazio"><p>📭 Nenhuma mensagem de apoio ainda</p></div>';
                    return;
                }

                const chaves = Object.keys(dados).reverse();
                chaves.forEach(function(chave) {
                    const msg = dados[chave];
                    const div = document.createElement('div');
                    div.className = 'bloco-mensagem';
                    div.innerHTML = `
                        <div class="msg-cabecalho">
                            💪 Mensagem
                            <span style="font-size:0.75rem;">${chave.substring(0, 8)}...</span>
                        </div>
                        <div class="msg-conteudo">${msg.texto || msg}</div>
                        <div class="msg-botoes">
                            <button class="btn-apagar" data-tipo="apoio" data-chave="${chave}">🗑️ Apagar Esta Mensagem</button>
                        </div>
                    `;
                    container.appendChild(div);
                });

                document.querySelectorAll('[data-tipo="apoio"]').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        if (confirm('Apagar esta mensagem?')) {
                            const chave = this.getAttribute('data-chave');
                            db.ref(`${CAMINHO_APOIO}/${chave}`).remove();
                        }
                    });
                });
            });
        }

        document.getElementById('btnLimparMural').addEventListener('click', function() {
            if (confirm('Tem certeza? Isso apagará TODAS as mensagens do Mural!')) {
                db.ref(CAMINHO_MURAL).remove();
            }
        });
