<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa — Fã Clube Serginho Cabeção</title>

    <script src="config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background-color: #f8f8f8;
            background-image: radial-gradient(#d4d4d4 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            padding: 1rem;
        }
        .escondido { display: none !important; }

        .caixa-login {
            background: #000;
            border: 6px solid #f4a900;
            border-radius: 24px;
            padding: 2.5rem 1.8rem;
            max-width: 400px;
            margin: 6rem auto;
            text-align: center;
        }
        .caixa-login h1 {
            color: #f4a900;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .subtitulo {
            color: #ffcc00;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .campo-senha {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .campo-senha input {
            width: 100%;
            padding: 1rem 3.5rem 1rem 1rem;
            background: #1a1a1a;
            border: 3px solid #f4a900;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .botao-olho {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }
        .aviso-erro {
            color: #ff6b6b;
            background: #2c1515;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #ff6b6b;
        }
        .btn-entrar {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, #f4a900, #ffcc00);
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            color: #000;
        }
        .link-voltar {
            display: inline-block;
            margin-top: 1rem;
            color: #f4a900;
            font-size: 1rem;
            text-decoration: none;
        }

        .caixa-painel {
            background: #000;
            border: 4px solid #f4a900;
            border-radius: 20px;
            padding: 1.5rem;
            max-width: 550px;
            margin: 0 auto;
            min-height: 80vh;
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .cabecalho h2 {
            color: #f4a900;
            font-size: 1.2rem;
        }
        .btn-sair {
            background: linear-gradient(90deg, #e53935, #f4511e);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .abas {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .aba {
            flex: 1;
            min-width: 100px;
            padding: 0.7rem;
            background: #222;
            border: 2px solid #444;
            border-radius: 10px;
            color: #aaa;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .aba.ativa {
            background: #f4a900;
            border-color: #ffcc00;
            color: #000;
        }
        .bloco-mensagem {
            background: #111;
            border: 2px solid #f4a900;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .msg-cabecalho {
            background: linear-gradient(90deg, #f4a900, #ffcc00);
            color: #000;
            padding: 0.6rem 1rem;
            font-weight: bold;
        }
        .msg-remetente {
            background: #1a1a1a;
            padding: 0.5rem 1rem;
            color: #f4a900;
            font-size: 0.9rem;
            border-bottom: 1px solid #333;
        }
        .id-usuario {
            font-size: 0.8rem;
            color: #888;
            margin-left: 0.5rem;
            background: #2a2a2a;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        .msg-conteudo {
            padding: 1rem;
            color: #ddd;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .resposta-area {
            padding: 0 1rem 1rem 1rem;
            border-top: 1px solid #333;
            margin-top: 0.5rem;
        }
        .resposta-label {
            color: #39ff14;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: block;
        }
        .resposta-dada {
            background: #1a2e1a;
            padding: 0.8rem;
            border-radius: 8px;
            color: #90ee90;
            border-left: 3px solid #39ff14;
            margin-bottom: 0.5rem;
        }
        .resposta-input {
            width: 100%;
            min-height: 80px;
            padding: 0.7rem;
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            outline: none;
            resize: vertical;
        }
        .resposta-input:focus {
            border-color: #39ff14;
        }
        .btn-responder {
            width: 100%;
            padding: 0.6rem;
            background: linear-gradient(90deg, #39ff14, #22cc00);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }
        .msg-botoes {
            padding: 0 1rem 1rem 1rem;
        }
        .btn-apagar {
            width: 100%;
            padding: 0.6rem;
            background: linear-gradient(90deg, #e53935, #c62828);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-limpar-tudo {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(90deg, #e53935, #c62828);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        .vazio {
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
        }
        .horario {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.3rem;
        }
        
        /* ===== COMENTÁRIOS DE VÍDEOS ===== */
        .video-titulo-ref {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <div id="telaLogin" class="caixa-login">
        <h1>🔐 Área Administrativa</h1>
        <p class="subtitulo">Fã Clube do Serginho Cabeção</p>

        <div class="campo-senha">
            <input type="password" id="campoSenha" placeholder="Digite a senha..." autocomplete="off">
            <button type="button" class="botao-olho" id="botaoOlho">🙈</button>
        </div>

        <p id="avisoErro" class="aviso-erro escondido">❌ Senha incorreta! Tente novamente.</p>

        <button class="btn-entrar" id="botaoEntrar">🔓 Entrar</button>

        <a href="javascript:history.back()" class="link-voltar">← Voltar para o site</a>
    </div>

    <div id="telaPainel" class="caixa-painel escondido">
        <div class="cabecalho">
            <h2>📋 Painel de Controle</h2>
            <button class="btn-sair" id="botaoSair">🚪 Sair</button>
        </div>

        <div class="abas">
            <button class="aba" id="abaApoio">📝 Mural</button>
            <button class="aba" id="abaChat">💬 Chat</button>
            <button class="aba" id="abaComentariosVideos">💬 Vídeos</button>
            <button class="aba" id="abaVideos">🎬 Mensagens</button>
        </div>

        <div id="listaApoio" class="escondido"></div>
        <div id="listaChat" class="escondido"></div>
        <div id="listaComentariosVideos" class="escondido"></div>
        <div id="listaVideos" class="escondido"></div>

        <button class="btn-limpar-tudo escondido" id="btnLimparApoio">🗑️ Apagar Tudo — Mural</button>
        <button class="btn-limpar-tudo escondido" id="btnLimparChat">🗑️ Apagar Tudo — Chat</button>
        <button class="btn-limpar-tudo escondido" id="btnLimparComentariosVideos">🗑️ Apagar Tudo — Comentários de Vídeos</button>
        <button class="btn-limpar-tudo" id="btnLimparVideos">🗑️ Apagar Tudo — Mensagens de Vídeos</button>

        <a href="javascript:history.back()" class="link-voltar" style="display:block;text-align:center;margin-top:2rem;color:#888;">← Voltar para o site</a>
    </div>

    <script>
        let db = null;
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }

        let abaAtual = 'apoio';
        let ouvinteApoio = null;
        let ouvinteChat = null;
        let ouvinteComentariosVideos = null;
        let ouvinteVideos = null;

        const CAMINHO_CHAT = "FãClube/chat/mensagens";
        const CAMINHO_APOIO = "MensagensApoio";
        const CAMINHO_COMENTARIOS_VIDEOS = "videos";
        const CAMINHO_VIDEOS = "todas_mensagens";

        const campoSenha = document.getElementById('campoSenha');
        const botaoOlho = document.getElementById('botaoOlho');
        const avisoErro = document.getElementById('avisoErro');
        let senhaVisivel = false;

        botaoOlho.addEventListener('click', function() {
            senhaVisivel = !senhaVisivel;
            campoSenha.type = senhaVisivel ? 'text' : 'password';
            botaoOlho.textContent = senhaVisivel ? '👁️' : '🙈';
        });

        document.getElementById('botaoEntrar').addEventListener('click', function() {
            const digitada = campoSenha.value.trim();
            if (typeof SENHA_ADMIN !== 'undefined' && digitada === SENHA_ADMIN) {
                avisoErro.classList.add('escondido');
                document.getElementById('telaLogin').classList.add('escondido');
                document.getElementById('telaPainel').classList.remove('escondido');
                abaAtual = 'apoio';
                atualizarAbas();
                carregarApoio();
            } else {
                avisoErro.classList.remove('escondido');
                campoSenha.value = '';
            }
        });

        document.getElementById('botaoSair').addEventListener('click', function() {
            if (confirm("Sair da área administrativa?")) {
                pararOuvirTudo();
                abaAtual = 'apoio';
                document.getElementById('telaPainel').classList.add('escondido');
                document.getElementById('telaLogin').classList.remove('escondido');
                avisoErro.classList.add('escondido');
                campoSenha.value = '';
                senhaVisivel = false;
                botaoOlho.textContent = '🙈';
                campoSenha.type = 'password';
            }
        });

        document.getElementById('abaApoio').addEventListener('click', function() {
            abaAtual = 'apoio';
            atualizarAbas();
            carregarApoio();
        });
        document.getElementById('abaChat').addEventListener('click', function() {
            abaAtual = 'chat';
            atualizarAbas();
            carregarChat();
        });
        document.getElementById('abaComentariosVideos').addEventListener('click', function() {
            abaAtual = 'comentarios-videos';
            atualizarAbas();
            carregarComentariosVideos();
        });
        document.getElementById('abaVideos').addEventListener('click', function() {
            abaAtual = 'videos';
            atualizarAbas();
            carregarVideos();
        });

        function atualizarAbas() {
            document.getElementById('abaApoio').classList.toggle('ativa', abaAtual === 'apoio');
            document.getElementById('abaChat').classList.toggle('ativa', abaAtual === 'chat');
            document.getElementById('abaComentariosVideos').classList.toggle('ativa', abaAtual === 'comentarios-videos');
            document.getElementById('abaVideos').classList.toggle('ativa', abaAtual === 'videos');
            
            document.getElementById('listaApoio').classList.toggle('escondido', abaAtual !== 'apoio');
            document.getElementById('listaChat').classList.toggle('escondido', abaAtual !== 'chat');
            document.getElementById('listaComentariosVideos').classList.toggle('escondido', abaAtual !== 'comentarios-videos');
            document.getElementById('listaVideos').classList.toggle('escondido', abaAtual !== 'videos');
            
            document.getElementById('btnLimparApoio').classList.toggle('escondido', abaAtual !== 'apoio');
            document.getElementById('btnLimparChat').classList.toggle('escondido', abaAtual !== 'chat');
            document.getElementById('btnLimparComentariosVideos').classList.toggle('escondido', abaAtual !== 'comentarios-videos');
            document.getElementById('btnLimparVideos').classList.toggle('escondido', abaAtual !== 'videos');
        }

        function pararOuvirTudo() {
            if (ouvinteApoio && db) {
                db.ref(CAMINHO_APOIO).off("value", ouvinteApoio);
                ouvinteApoio = null;
            }
            if (ouvinteChat && db) {
                db.ref(CAMINHO_CHAT).off("value", ouvinteChat);
                ouvinteChat = null;
            }
            if (ouvinteComentariosVideos && db) {
                db.ref(CAMINHO_COMENTARIOS_VIDEOS).off("value", ouvinteComentariosVideos);
                ouvinteComentariosVideos = null;
            }
                    if (ouvinteVideos && db) {
            db.ref(CAMINHO_VIDEOS).off("value", ouvinteVideos);
            ouvinteVideos = null;
        }
    }

    function dataRespostaAtual() {
        return new Date().toLocaleString('pt-BR', {
            day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
        });
        }

    function carregarComentariosVideos() {
        if (!db) {
            document.getElementById('listaComentariosVideos').innerHTML = 
                '<div class="vazio">⚠️ Firebase não conectado. Verifique o config.js</div>';
            return;
        }
        pararOuvirTudo();
        
        ouvinteComentariosVideos = db.ref(CAMINHO_COMENTARIOS_VIDEOS).on("value", function(snapshot) {
            const container = document.getElementById('listaComentariosVideos');
            container.innerHTML = '';

            if (!snapshot.exists()) {
                container.innerHTML = '<div class="vazio">💬 Nenhum comentário de vídeo ainda</div>';
                return;
            }

            let temComentarios = false;
            snapshot.forEach(function(videoSnap) {
                const videoId = videoSnap.key;
                const dadosVideo = videoSnap.val();
                const comentarios = dadosVideo.comentarios || {};
                
                for (const chave in comentarios) {
                    temComentarios = true;
                    const c = comentarios[chave];
                    const temResposta = c.resposta && c.resposta.trim() !== '';
                    
                    const div = document.createElement('div');
                    div.className = 'bloco-mensagem';
                    
                    let respostaHTML = '';
                    if (temResposta) {
                        respostaHTML = `
                            <div class="resposta-area">
                                <span class="resposta-label">✅ Resposta enviada:</span>
                                <div class="resposta-dada">
                                    ${c.resposta}
                                    <div class="horario">🕒 ${c.dataResposta || ''}</div>
                                </div>
                            </div>
                        `;
                    } else {
                        respostaHTML = `
                            <div class="resposta-area">
                                <span class="resposta-label">✏️ Responder comentário:</span>
                                <textarea class="resposta-input" id="resposta-cmt-${chave}" placeholder="Escreva sua resposta aqui..."></textarea>
                                <button class="btn-responder" data-video="${videoId}" data-chave="${chave}">📤 Enviar Resposta</button>
                            </div>
                        `;
                    }
                    
                    div.innerHTML = `
                        <div class="msg-cabecalho">💬 Comentário de Vídeo</div>
                        <div class="video-titulo-ref">🎬 Vídeo: ${videoId}</div>
                        <div class="msg-remetente">
                            👤 ${c.nome || 'Visitante'}
                            <div class="horario">🕒 ${c.data || 'Sem data'}</div>
                        </div>
                        <div class="msg-conteudo">${c.texto}</div>
                        ${respostaHTML}
                        <div class="msg-botoes">
                            <button class="btn-apagar" data-video="${videoId}" data-chave="${chave}">🗑️ Apagar este comentário</button>
                        </div>
                    `;
                    container.appendChild(div);
                }
            });

            if (!temComentarios) {
                container.innerHTML = '<div class="vazio">💬 Nenhum comentário de vídeo ainda</div>';
                return;
            }

            container.querySelectorAll('.btn-responder').forEach(function(botao) {
                botao.addEventListener('click', function() {
                    const videoId = this.getAttribute('data-video');
                    const chave = this.getAttribute('data-chave');
                    const campo = document.getElementById(`resposta-cmt-${chave}`);
                    const textoResposta = campo.value.trim();
                    
                    if (!textoResposta) {
                        alert('⚠️ Escreva uma resposta primeiro!');
                        return;
                    }
                    
                    db.ref(`${CAMINHO_COMENTARIOS_VIDEOS}/${videoId}/comentarios/${chave}`).update({
                        resposta: textoResposta,
                        dataResposta: dataRespostaAtual()
                    }).then(() => {
                        alert('✅ Resposta enviada com sucesso! Aparecerá no vídeo automaticamente.');
                    }).catch(err => {
                        alert('❌ Erro: ' + err.message);
                    });
                });
            });

            container.querySelectorAll('.btn-apagar').forEach(function(botao) {
                botao.addEventListener('click', function() {
                    const videoId = this.getAttribute('data-video');
                    const chave = this.getAttribute('data-chave');
                    if (confirm('Apagar este comentário?')) {
                        db.ref(`${CAMINHO_COMENTARIOS_VIDEOS}/${videoId}/comentarios/${chave}`).remove();
                    }
                });
            });
        });
        }

    function carregarApoio() {
        if (!db) return;
        pararOuvirTudo();
        
        ouvinteApoio = db.ref(CAMINHO_APOIO).on("value", function(snapshot) {
            const container = document.getElementById('listaApoio');
            container.innerHTML = '';

            if (!snapshot.exists()) {
                container.innerHTML = '<div class="vazio">📭 Nenhuma mensagem no Mural ainda</div>';
                return;
            }

            const dados = snapshot.val();
            const chaves = Object.keys(dados).reverse();

            chaves.forEach(function(chave) {
                const msg = dados[chave];
                const div = document.createElement('div');
                div.className = 'bloco-mensagem';

                let respostaHTML = "";
                if (msg.resposta) {
                    respostaHTML = `
                        <div class="resposta-area">
                            <span class="resposta-label">✅ Resposta enviada:</span>
                            <div class="resposta-dada">
                                ${msg.resposta}
                                <div class="horario">🕒 ${msg.dataResposta || ''}</div>
                            </div>
                        </div>
                    `;
                } else {
                    respostaHTML = `
                        <div class="resposta-area">
                            <span class="resposta-label">✏️ Responder para o fã:</span>
                            <textarea class="resposta-input" id="resposta-${chave}" placeholder="Escreva sua resposta aqui..."></textarea>
                            <button class="btn-responder" data-chave="${chave}" data-caminho="${CAMINHO_APOIO}">📤 Enviar Resposta</button>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div class="msg-cabecalho">📝 Mensagem do Mural</div>
                    <div class="msg-remetente">
                        👤 ${msg.nomeRemetente || msg.nome || 'Anônimo'}
                        <span class="id-usuario">🆔 ${msg.idRemetente || msg.id || '—'}</span>
                        <div class="horario">🕒 ${msg.data || msg.horario || 'Sem data'}</div>
                    </div>
                    <div class="msg-conteudo">${msg.texto || msg.mensagem || ''}</div>
                    ${respostaHTML}
                    <div class="msg-botoes">
                        <button class="btn-apagar" data-caminho="${CAMINHO_APOIO}" data-chave="${chave}">🗑️ Apagar esta mensagem</button>
                    </div>
                `;
                container.appendChild(div);
            });

            container.querySelectorAll('.btn-responder').forEach(function(botao) {
                botao.addEventListener('click', function() {
                    const chave = this.getAttribute('data-chave');
                    const caminho = this.getAttribute('data-caminho');
                    const campo = document.getElementById(`resposta-${chave}`);
                    const textoResposta = campo.value.trim();
                    
                    if (!textoResposta) {
                        alert('⚠️ Escreva uma resposta primeiro!');
                        return;
                    }
                    
                    db.ref(`${caminho}/${chave}`).update({
                        resposta: textoResposta,
                        dataResposta: dataRespostaAtual()
                    }).then(() => {
                        alert('✅ Resposta enviada com sucesso!');
                    }).catch(err => {
                        alert('❌ Erro ao enviar resposta: ' + err.message);
                    });
                });
            });

            container.querySelectorAll('.btn-apagar').forEach(function(botao) {
                botao.addEventListener('click', function() {
                    const caminho = this.getAttribute('data-caminho');
                    const chave = this.getAttribute('data-chave');
                    if (confirm('Apagar esta mensagem?')) {
                        db.ref(`${caminho}/${chave}`).remove();
                    }
                });
            });
        });
    }

    function carregarChat() {
        if (!db) {
            document.getElementById('listaChat').innerHTML = 
                '<div class="vazio">⚠️ Firebase não conectado. Verifique o config.js</div>';
            return;
        }
        pararOuvirTudo();
        
        ouvinteChat = db.ref(CAMINHO_CHAT).on("value", function(snapshot) {
            const container = document.getElementById('listaChat');
            container.innerHTML = '';

            if (!snapshot.exists()) {
                container.innerHTML = '<div class="vazio">💬 Nenhuma mensagem de chat ainda</div>';
                return;
            }

            const dados = snapshot.val();
            const chaves = Object.keys(dados).reverse();

            chaves.forEach(function(chave) {
                const msg = dados[chave];
                const div = document.createElement('div');
                div.className = 'bloco-mensagem';
                
                let respostaHTML = '';
                if (msg.resposta) {
                    respostaHTML = `
                        <div class="resposta-area">
                            <span class="resposta-label">✅ Resposta enviada:</span>
                            <div class="resposta-dada">
                                ${msg.resposta}
                                <div class="horario">🕒 ${msg.dataResposta || ''}</div>
                            </div>
                        </div>
                    `;
                } else {
                    respostaHTML = `
                        <div class="resposta-area">
                            <span class="resposta-label">✏️ Responder para o fã:</span>
                            <textarea class="resposta-input" id="resposta-${chave}" placeholder="Escreva sua resposta aqui..."></textarea>
                            <button class="btn-responder" data-chave="${chave}" data-caminho="${CAMINHO_CHAT}">📤 Enviar Resposta</button>
                        </div>
                    `;
                }
                
                div.innerHTML = `
                    <div class="msg-cabecalho">💬 Mensagem do Chat</div>
                    <div class="msg-remetente">
                        👤 ${msg.nomeRemetente || 'Anônimo'}
                        <span class="id-usuario">🆔 ${msg.idRemetente || '—'}</span>
                        <div class="horario">🕒 ${msg.data || 'Sem data'}</div>
                    </div>
                    <div class="msg-conteudo">${msg.texto || ''}</div>
                    ${respostaHTML}
                    <div class="msg-botoes">
                        <button class="btn-apagar" data-caminho="${CAMINHO_CHAT}" data-chave="${chave}">🗑️ Apagar esta mensagem</button>
                    </div>
                `;
                container.appendChild(div);
            });

            container.querySelectorAll('.btn-responder').forEach(function(botao) {
                botao.addEventListener('click', function() {
                    const chave = this.getAttribute('data-chave');
                    const caminho = this.getAttribute('data-caminho');
                    const campo = document.getElementById(`resposta-${chave}`);
                    const textoResposta = campo.value.trim();
                    
                    if (!textoResposta) {
                        alert('⚠️ Escreva uma resposta primeiro!');
                        return;
                    }
                    
                    db.ref(`${caminho}/${chave}`).update({
                        resposta: textoResposta,
                        dataResposta: dataRespostaAtual()
                    }).then(() => {
                        alert('✅ Resposta enviada com sucesso!');
                    }).catch(err => {
                        alert('❌ Erro ao enviar resposta: ' + err.message);
                    });
                });
            });

            container.querySelectorAll('.btn-apagar').forEach(function(botao) {
                botao.addEventListener('click', function() {
                    const caminho = this.getAttribute('data-caminho');
                    const chave = this.getAttribute('data-chave');
                    if (confirm('Apagar esta mensagem?')) {
                        db.ref(`${caminho}/${chave}`).remove();
                    }
                });
            });
        });
    }

    function carregarVideos() {
        if (!db) {
            document.getElementById('listaVideos').innerHTML = 
                '<div class="vazio">⚠️ Firebase não conectado. Verifique o config.js</div>';
            return;
        }
        pararOuvirTudo();
        
        ouvinteVideos = db.ref(CAMINHO_VIDEOS).on("value", function(snapshot) {
            const container = document.getElementById('listaVideos');
            container.innerHTML = '';

            if (!snapshot.exists()) {
                container.innerHTML = '<div class="vazio">🎬 Nenhuma mensagem de vídeo ainda</div>';
                return;
            }

            const dados = snapshot.val();
            const chaves = Object.keys(dados).reverse();

            chaves.forEach(function(chave) {
                const msg = dados[chave];
                const div = document.createElement('div');
                div.className = 'bloco-mensagem';
                
                div.innerHTML = `
                    <div class="msg-cabecalho">🎬 Mensagem de Vídeo</div>
                    <div class="msg-remetente">
                        👤 ${msg.nomeRemetente || 'Anônimo'}
                        <span class="id-usuario">🆔 ${msg.idRemetente || '—'}</span>
                        <div class="horario">🕒 ${msg.data || 'Sem data'}</div>
                    </div>
                    <div class="msg-conteudo">
                        <strong>Vídeo:</strong> ${msg.nomeVideo || 'Não informado'}<br><br>
                        <strong>Mensagem:</strong><br>
                        ${msg.mensagem || msg.texto || ''}
                    </div>
                    <div class="msg-botoes">
                        <button class="btn-apagar" data-caminho="${CAMINHO_VIDEOS}" data-chave="${chave}">🗑️ Apagar esta mensagem</button>
                    </div>
                `;
                container.appendChild(div);
            });

            container.querySelectorAll('.btn-apagar').forEach(function(botao) {
                botao.addEventListener('click', function() {
                    const caminho = this.getAttribute('data-caminho');
                    const chave = this.getAttribute('data-chave');
                    if (confirm('Apagar esta mensagem?')) {
                        db.ref(`${caminho}/${chave}`).remove();
                    }
                });
            });
        });
    }
