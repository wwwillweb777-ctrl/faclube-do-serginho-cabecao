<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens de Apoio 💪</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; background: #000;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }
        .tela-completa {
            width: 100%; height: 100%; border: 4px solid #ffd700;
            padding: 0.8rem 1rem 1rem; display: flex;
            flex-direction: column; background: #000;
        }
        .cabecalho { text-align: center; padding: 0.3rem 0 0.6rem; }
        .titulo-com-icone {
            display: flex; align-items: center;
            justify-content: center; gap: 0.6rem; margin-bottom: 0.4rem;
        }
        .icone { font-size: 2rem; line-height: 1; }
        h1 { color: #ffd700; font-size: 1.4rem; }
        .descricao {
            color: #ddd; font-size: 0.9rem;
            line-height: 1.4; margin-bottom: 0.7rem;
        }
        .campos-info {
            flex-shrink: 0; margin-bottom: 0.7rem;
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .campos-info input {
            width: 100%; background: #222; border: 2px solid #444;
            border-radius: 10px; color: #fff; padding: 0.6rem 0.9rem;
            font-size: 0.95rem; outline: none;
        }
        .campos-info input:focus { border-color: #ffd700; }
        .area-texto { flex-shrink: 0; margin-bottom: 0.7rem; }
        textarea {
            width: 100%; height: 80px; background: #222;
            border: 2px solid #444; border-radius: 12px;
            color: #fff; padding: 0.7rem 0.9rem;
            font-size: 1rem; resize: none; outline: none;
        }
        textarea:focus { border-color: #ffd700; }
        .botao-enviar-container, .botao-ver-container {
            display: flex; justify-content: center;
            margin-bottom: 0.6rem; flex-shrink: 0;
        }
        button.enviar {
            width: 65%; background: linear-gradient(90deg, #ffd700, #ffb300);
            color: #000; border: none; padding: 0.75rem;
            border-radius: 12px; font-size: 1rem;
            font-weight: bold; cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
            transition: transform 0.2s;
        }
        button.enviar:active { transform: scale(0.97); }
        a.ver-mensagens {
            width: 65%; background: transparent;
            border: 2px solid #ffd700; color: #ffd700;
            padding: 0.7rem; border-radius: 12px;
            font-size: 0.95rem; font-weight: bold;
            text-align: center; text-decoration: none;
            cursor: pointer; transition: all 0.2s;
        }
        a.ver-mensagens:active { background: rgba(255, 215, 0, 0.1); }
        button.voltar {
            width: 100%; background: transparent;
            border: 3px solid #ffd700; color: #ffd700;
            padding: 0.8rem; border-radius: 12px;
            font-size: 1rem; cursor: pointer;
            transition: background 0.2s; flex-shrink: 0;
            margin-top: auto;
        }
        button.voltar:active { background: rgba(255, 215, 0, 0.1); }
    </style>
</head>
<body>
    <div class="tela-completa">
        <div class="cabecalho">
            <div class="titulo-com-icone">
                <span class="icone">💪</span>
                <h1>Mensagens de Apoio</h1>
            </div>
            <p class="descricao">Deixe aqui sua mensagem de força e apoio para o Serginho Cabeção! Sua palavra é importante! 💛</p>
        </div>

        <div class="campos-info">
            <input type="text" id="campoNome" placeholder="Seu nome ou apelido..." maxlength="30">
            <input type="text" id="campoRede" placeholder="De onde você é? Ex: TikTok / Instagram..." maxlength="30">
            <input type="text" id="campoArroba" placeholder="Seu @ (opcional)" maxlength="30">
        </div>

        <div class="area-texto">
            <textarea id="campoMensagem" placeholder="Escreva sua mensagem de apoio aqui..."></textarea>
        </div>

        <div class="botao-enviar-container">
            <button class="enviar" onclick="enviarMensagem()">✅ Enviar Mensagem</button>
        </div>

        <div class="botao-ver-container">
            <a href="mensagens-dos-fas.html" class="ver-mensagens">📜 Ver Mensagens dos Fãs</a>
        </div>

        <button class="voltar" onclick="voltarPagina()">⬅️ Voltar ao Menu</button>
    </div>

    <script>
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function enviarMensagem() {
            const nome = document.getElementById('campoNome').value.trim() || "Anônimo";
            const rede = document.getElementById('campoRede').value.trim() || "Não informado";
            let arroba = document.getElementById('campoArroba').value.trim();
            if (!arroba) arroba = "@desconhecido";
            else if (!arroba.startsWith('@')) arroba = '@' + arroba;

            const texto = document.getElementById('campoMensagem').value.trim();
            if (!texto) {
                alert('Por favor, escreva sua mensagem primeiro! 💛');
                return;
            }
            
            try {
                await db.ref("MensagensApoio").push({
                    nome, rede, arroba, texto,
                    horario: new Date().toLocaleString('pt-BR')
                });
                
                document.getElementById('campoNome').value = '';
                document.getElementById('campoRede').value = '';
                document.getElementById('campoArroba').value = '';
                document.getElementById('campoMensagem').value = '';
                
                alert('✅ Mensagem enviada com sucesso! Obrigado pelo apoio! 💪💛');
            } catch (erro) {
                alert('❌ Erro ao enviar. Tente novamente!');
                console.error(erro);
            }
        }

        function voltarPagina() {
            if (window.history.length > 1) history.back();
            else window.location.href = 'index.html';
        }
    </script>
</body>
</html>
