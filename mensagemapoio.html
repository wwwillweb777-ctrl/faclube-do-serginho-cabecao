<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens de Apoio 💪</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
        }
        .tela-completa {
            width: 100%;
            min-height: 100vh;
            border: 4px solid #ffd700;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            background: #000;
        }
        .cabecalho {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .titulo-com-icone {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .icone {
            font-size: 2rem;
        }
        h1 {
            color: #ffd700;
            font-size: 1.8rem;
        }
        .descricao {
            color: #fff;
            font-size: 1rem;
            line-height: 1.5;
        }
        .campos-info {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .campos-info input {
            width: 100%;
            background: #2b2b2b;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            color: #fff;
            font-size: 1rem;
        }
        .area-texto {
            margin-bottom: 1.5rem;
        }
        textarea {
            width: 100%;
            background: #2b2b2b;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            color: #fff;
            font-size: 1rem;
            min-height: 100px;
            resize: none;
        }
        button.enviar {
            width: 100%;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        a.ver-mensagens {
            display: block;
            width: 100%;
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            margin-bottom: 1rem;
        }
        button.voltar {
            width: 100%;
            background: transparent;
            border: 3px solid #ffd700;
            color: #ffd700;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="tela-completa">
        <div class="cabecalho">
            <div class="titulo-com-icone">
                <span class="icone">💪</span>
                <h1>Mensagens de Apoio</h1>
            </div>
            <p class="descricao">Deixe aqui sua mensagem de força e apoio para o Serginho Cabeção! Sua palavra é importante! 💛</p>
        </div>

        <div class="campos-info">
            <input type="text" id="campoNome" placeholder="Seu nome ou apelido...">
            <input type="text" id="campoRede" placeholder="De onde você é? Ex: TikTok / Instagram...">
            <input type="text" id="campoArroba" placeholder="Seu @ (opcional)">
        </div>

        <div class="area-texto">
            <textarea id="campoMensagem" placeholder="Escreva sua mensagem de apoio aqui..."></textarea>
        </div>

        <button class="enviar" onclick="enviarMensagem()">✅ Enviar Mensagem</button>

        <a href="mensagens-dos-fas.html" class="ver-mensagens">📜 Ver Mensagens dos Fãs</a>

        <button class="voltar" onclick="voltarPagina()">⬅️ Voltar ao Menu</button>
    </div>

    <script>
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        async function enviarMensagem() {
            const nome = document.getElementById('campoNome').value.trim() || "Anônimo";
            const rede = document.getElementById('campoRede').value.trim() || "Não informado";
            const arroba = document.getElementById('campoArroba').value.trim() || "";
            const texto = document.getElementById('campoMensagem').value.trim();

            if (!texto) {
                alert('Por favor, escreva sua mensagem primeiro! 💛');
                return;
            }

            try {
                await db.ref("MensagensApoio").push({
                    nome: nome,
                    rede: rede,
                    arroba: arroba,
                    texto: texto,
                    horario: new Date().toLocaleString('pt-BR')
                });

                document.getElementById('campoNome').value = '';
                document.getElementById('campoRede').value = '';
                document.getElementById('campoArroba').value = '';
                document.getElementById('campoMensagem').value = '';

                alert('✅ Mensagem enviada com sucesso! Obrigado pelo apoio! 💪💛');
            } catch (erro) {
                alert('❌ Erro ao enviar. Tente novamente!');
                console.error(erro);
            }
        }

        function voltarPagina() {
            if (window.history.length > 1) {
                history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
