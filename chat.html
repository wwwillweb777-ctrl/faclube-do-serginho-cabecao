<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Chat — Fã Clube do Serginho Cabeção</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script src="config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #1a1208;
            background-image: radial-gradient(#3a2a18 1px, transparent 1px), radial-gradient(#3a2a18 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .caixa-chat {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .cabecalho {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background: linear-gradient(90deg, #f4a900, #ffc107);
            color: #000;
            padding: 0.6rem 1rem;
            padding-left: 85px;
            padding-right: 1rem;
            text-align: center;
        }
        .cabecalho h1 { font-size: 1rem; margin-bottom: 0.1rem; }
        .cabecalho p { font-size: 0.78rem; opacity: 0.8; }
        .meu-id { font-size: 0.65rem; opacity: 0.75; margin-top: 0.1rem; background: rgba(0,0,0,.15); padding: 0.15rem 0.5rem; border-radius: 50px; display: inline-block; }
        
        .btn-voltar {
            position: fixed;
            top: 0.55rem;
            left: 0.6rem;
            z-index: 10000;
        }
        .btn-voltar a {
            display: inline-block;
            background: #ff6b6b;
            border: 2px solid #000;
            color: #000;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 0.35rem 0.7rem;
            border-radius: 6px;
            text-decoration: none;
        }

        .espaco-cabecalho {
            height: 90px;
            flex-shrink: 0;
        }
        .area-mensagens {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
            background: #111;
        }
        .mensagem { 
            margin-bottom: 0.6rem; 
            max-width: 85%;
            position: relative;
        }
        .mensagem-eu { margin-left: auto; }
        .mensagem-eu .bolha { 
            background: #ffffff; 
            color: #000; 
            border-radius: 16px 16px 4px 16px; 
            padding: 0.5rem 2.2rem 0.5rem 0.75rem; 
            font-size: 0.92rem;
            line-height: 1.4;
        }
        .mensagem-resposta { margin-right: auto; }
        .mensagem-resposta .bolha { 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 16px 16px 16px 4px; 
            padding: 0.5rem 0.75rem; 
            font-size: 0.92rem;
            line-height: 1.4;
        }
        .nome-remetente { 
            font-weight: bold; 
            font-size: 0.8rem; 
            margin-bottom: 0.15rem; 
            color: #f4a900; 
        }
        .data { 
            font-size: 0.68rem; 
            opacity: 0.6; 
            margin-top: 0.2rem; 
            color: #999; 
        }
        .apagar-msg {
            position: absolute;
            top: 0.4rem;
            right: 0.5rem;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 10;
            display: block;
            opacity: 1;
        }
        .apagar-msg:active, .apagar-msg:hover {
            color: #ff4444;
        }
        .aviso-vazio { text-align: center; color: #888; padding: 2rem; font-size: 0.95rem; }
        .form-etapa { 
            padding: 0.8rem 1rem; 
            border-top: 2px solid #333; 
            background: #111; 
            flex-shrink: 0;
        }
        .escondido { display: none !important; }
        
        .enviar-cima {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }
        .btn-mudar-nome {
            background: transparent;
            border: 1px solid #f4a900;
            color: #f4a900;
            font-size: 0.8rem;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-enviar-topo {
            background: #ff6b6b;
            border: 2px solid #000;
            color: #000;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }
        input, textarea { 
            width: 100%; 
            padding: 0.75rem; 
            border: 2px solid #444; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            margin-bottom: 0.6rem; 
            outline: none; 
            background: #222; 
            color: #fff; 
        }
        .boas-vindas { 
            background: #2a2315; 
            padding: 0.75rem; 
            border-radius: 10px; 
            margin-bottom: 0.8rem; 
            text-align: center; 
            color: #f4a900; 
            border: 1px solid #443820; 
            font-size: 0.95rem;
        }
        .editar-nome-container {
            background: #1a1a1a;
            padding: 0.7rem;
            border-radius: 8px;
            margin-bottom: 0.6rem;
            display: flex;
            gap: 0.5rem;
        }
        .editar-nome-container input { flex: 1; margin: 0; }
        .btn-salvar-nome {
            padding: 0.5rem 0.8rem;
            background: #39ff14;
            color: #000;
            border-radius: 6px;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
        }
        .btn-cancelar-nome {
            padding: 0.5rem 0.8rem;
            background: #444;
            color: #fff;
            border-radius: 6px;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
        }
        .btn-principal { 
            background: linear-gradient(90deg, #f4a900, #ffc107); 
            color: #000; 
            border: none;
            padding: 0.8rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="btn-voltar">
        <a href="#" onclick="history.back(); return false;">← Voltar</a>
    </div>
    <div class="cabecalho">
        <h1>💬 Chat do Fã Clube 🐸</h1>
        <p>Converse com outros fãs do Serginho Cabeção 💛</p>
        <div class="meu-id">🆔 Seu ID: <span id="exibirMeuId">—</span></div>
    </div>

    <div class="caixa-chat">
        <div class="espaco-cabecalho"></div>

        <div id="areaMensagens" class="area-mensagens">
            <p class="aviso-vazio">Olá! 🐸<br>Digite seu nome abaixo para começar ↓</p>
        </div>

        <div id="passoNome" class="form-etapa">
            <input type="text" id="nomeChat" placeholder="Digite seu nome ou @ ✨">
            <button class="btn-principal" onclick="salvarNome()">Entrar no Chat →</button>
        </div>

        <div id="passoMensagem" class="form-etapa escondido">
            <div class="boas-vindas" id="mensagemBoasVindas"></div>
            
            <div id="editarNomeBloco" class="editar-nome-container escondido">
                <input type="text" id="novoNomeInput" placeholder="Seu novo nome...">
                <button class="btn-salvar-nome" onclick="salvarNovoNome()">✓ Salvar</button>
                <button class="btn-cancelar-nome" onclick="cancelarMudarNome()">✕</button>
            </div>
            
            <div class="enviar-cima">
                <button class="btn-mudar-nome" onclick="mostrarEditarNome()">✏️ Mudar nome</button>
                <button class="btn-enviar-topo" onclick="enviarMensagem()">📤 Enviar</button>
            </div>
            
            <textarea id="campoMensagem" rows="3" placeholder="Escreva sua mensagem aqui... 🐸💛"></textarea>
        </div>
    </div>

    <script>
        const NOME_ADMIN = "Equipe do Fã Clube 🐸";
        const CAMINHO_MSG = "FãClube/chat/mensagens";
        const CAMINHO_ACESSOS = "FãClube/chat/acessos";
        const CHAVE_ID = "idVisitante_faclube";
        const CHAVE_NOME = "nomeVisitante_faclube";

        function gerarIdUnico() {
            const p1 = Math.random().toString(36).slice(2,6);
            const p2 = Math.random().toString(36).slice(2,6);
            return `fã_${p1}${p2}`;
        }

        let ID_VISITANTE = localStorage.getItem(CHAVE_ID);
        if (!ID_VISITANTE) {
            ID_VISITANTE = gerarIdUnico();
            localStorage.setItem(CHAVE_ID, ID_VISITANTE);
        }
        document.getElementById('exibirMeuId').textContent = ID_VISITANTE;

        let nomeUsuario = localStorage.getItem(CHAVE_NOME) || "";

        function dataAtual() {
            return new Date().toLocaleString('pt-BR', {
                day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
            });
        }

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = async function() {
            const snap = await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).once("value");
            const nomeBanco = snap.val();
            
            if (nomeBanco && nomeBanco.trim() !== "") {
                nomeUsuario = nomeBanco;
                localStorage.setItem(CHAVE_NOME, nomeUsuario);
                entrarNoChat();
            } 
            else if (nomeUsuario && nomeUsuario.trim() !== "") {
                await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).set(nomeUsuario);
                entrarNoChat();
            }
        };

        async function salvarNome() {
            const nome = document.getElementById('nomeChat').value.trim();
            if (!nome) { alert("⚠️ Digite seu nome ou apelido!"); return; }
            
            nomeUsuario = nome;
            localStorage.setItem(CHAVE_NOME, nomeUsuario);
            await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).set(nomeUsuario);
            
            entrarNoChat();
        }

        function entrarNoChat() {
            document.getElementById('passoNome').classList.add('escondido');
            document.getElementById('passoMensagem').classList.remove('escondido');
            document.getElementById('mensagemBoasVindas').innerHTML = `👋 Bem-vindo, <strong>${nomeUsuario}</strong>! 🐸💛<br>Converse com a gente e com outros fãs!`;
            carregarMensagens();
        }

        function mostrarEditarNome() {
            document.getElementById('novoNomeInput').value = nomeUsuario;
            document.getElementById('editarNomeBloco').classList.remove('escondido');
        }

        function cancelarMudarNome() {
            document.getElementById('editarNomeBloco').classList.add('escondido');
            document.getElementById('novoNomeInput').value = '';
        }

        async function salvarNovoNome() {
            const novoNome = document.getElementById('novoNomeInput').value.trim();
            if (!novoNome) { alert("⚠️ Digite um nome!"); return; }
            
            nomeUsuario = novoNome;
            localStorage.setItem(CHAVE_NOME, nomeUsuario);
            await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).set(nomeUsuario);
            
            document.getElementById('mensagemBoasVindas').innerHTML = `👋 Bem-vindo, <strong>${nomeUsuario}</strong>! 🐸💛<br>Converse com a gente e com outros fãs!`;
            cancelarMudarNome();
            alert("✅ Nome alterado para: " + novoNome);
        }

        async function enviarMensagem() {
            const texto = document.getElementById('campoMensagem').value.trim();
            if (!texto) { alert("⚠️ Escreva sua mensagem primeiro!"); return; }
            
            await db.ref(CAMINHO_MSG).push({
                idRemetente: ID_VISITANTE,
                nomeRemetente: nomeUsuario,
                texto: texto,
                data: dataAtual(),
                resposta: null,
                dataResposta: null
            });
            
            document.getElementById('campoMensagem').value = '';
        }

        async function apagarMensagem(chave) {
            if (confirm("🗑️ Apagar esta mensagem? Esta ação não pode ser desfeita.")) {
                await db.ref(`${CAMINHO_MSG}/${chave}`).remove();
            }
        }

        function carregarMensagens() {
            const area = document.getElementById('areaMensagens');
            db.ref(CAMINHO_MSG).orderByChild("idRemetente").equalTo(ID_VISITANTE).on("value", snap => {
                area.innerHTML = '';
                if (!snap.exists()) {
                    area.innerHTML = '<p class="aviso-vazio">Ainda não tem mensagens 💬<br>Seja o primeiro a falar!</p>';
                    return;
                }
                snap.forEach(item => {
                    const chave = item.key;
                    const m = item.val();
                    area.innerHTML += `
                        <div class="mensagem mensagem-eu">
                            <button class="apagar-msg" onclick="apagarMensagem('${chave}')">🗑️</button>
                            <div class="bolha">
                                <p class="nome-remetente">${m.nomeRemetente}</p>
                                <p>${m.texto}</p>
                                <p class="data">${m.data}</p>
                            </div>
                        </div>
                    `;
                    if (m.resposta) area.innerHTML += `
                        <div class="mensagem mensagem-resposta">
                            <div class="bolha">
                                <p class="nome-remetente">📩 ${NOME_ADMIN}</p>
                                <p>${m.resposta}</p>
                                <p class="data">${m.dataResposta || ''}</p>
                            </div>
                        </div>
                    `;
                            });
            area.scrollTop = area.scrollHeight;
        });
    }
</script>
</body>
</html>
