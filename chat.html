<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Chat — Fã Clube do Serginho Cabeção</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script src="config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1208 0%, #2c1e0f 100%);
            background-image: radial-gradient(#3a2a18 1px, transparent 1px), radial-gradient(#3a2a18 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
        }
        .caixa-chat {
            max-width: 450px; margin: 0 auto; background: #000;
            border-radius: 24px; border: 3px solid #f4a900; display: flex; flex-direction: column;
            box-shadow: 0 0 25px rgba(244, 169, 0, 0.25); overflow: hidden;
        }
        .cabecalho {
            background: linear-gradient(90deg, #f4a900, #ffc107); color: #000; padding: 1.2rem; text-align: center;
        }
        .cabecalho h1 { font-size: 1.25rem; margin-bottom: 0.3rem; }
        .cabecalho p { font-size: 0.9rem; opacity: 0.8; }
        .meu-id { font-size: 0.75rem; opacity: 0.75; margin-top: 0.4rem; background: rgba(0,0,0,.15); padding: 0.25rem 0.8rem; border-radius: 50px; display: inline-block; }
        .area-mensagens { height: 400px; overflow-y: auto; padding: 1rem; background: #111; }
        .mensagem { margin-bottom: 1rem; max-width: 85%; }
        .mensagem-eu { margin-left: auto; }
        .mensagem-eu .bolha { background: linear-gradient(90deg, #f4a900, #ffc107); color: #000; border-radius: 18px 18px 4px 18px; padding: 0.8rem 1rem; }
        .mensagem-resposta { margin-right: auto; }
        .mensagem-resposta .bolha { background: #222; color: #fff; border: 1px solid #444; border-radius: 18px 18px 18px 4px; padding: 0.8rem 1rem; }
        .nome-remetente { font-weight: bold; font-size: 0.85rem; margin-bottom: 0.2rem; color: #f4a900; }
        .data { font-size: 0.7rem; opacity: 0.6; margin-top: 0.3rem; color: #999; }
        .aviso-vazio { text-align: center; color: #999; padding: 2rem; }
        .form-etapa { padding: 1.2rem; border-top: 2px solid #333; background: #111; }
        .escondido { display: none !important; }
        input, textarea { width: 100%; padding: 0.9rem; border: 2px solid #444; border-radius: 12px; font-size: 1rem; margin-bottom: 0.8rem; outline: none; background: #222; color: #fff; }
        input:focus, textarea:focus { border-color: #f4a900; }
        button { width: 100%; padding: 0.9rem; border: none; border-radius: 50px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-principal { background: linear-gradient(90deg, #f4a900, #ffc107); color: #000; box-shadow: 0 0 12px rgba(244, 169, 0, 0.3); }
        .boas-vindas { background: #2a2315; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; text-align: center; color: #f4a900; border: 1px solid #443820; }
        .voltar { text-align: center; margin-top: 1.5rem; }
        .voltar a { color: #f4a900; text-decoration: none; font-weight: 500; }
        .voltar a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="caixa-chat">
        <div class="cabecalho">
            <h1>💬 Chat do Fã Clube 🐸</h1>
            <p>Converse com outros fãs do Serginho Cabeção 💛</p>
            <div class="meu-id">🆔 Seu ID: <span id="exibirMeuId">—</span></div>
        </div>
        <div id="areaMensagens" class="area-mensagens">
            <p class="aviso-vazio">Olá! 🐸<br>Digite seu nome abaixo para começar ↓</p>
        </div>
        <div id="passoNome" class="form-etapa">
            <input type="text" id="nomeChat" placeholder="Digite seu nome ou @ ✨">
            <button class="btn-principal" onclick="salvarNome()">Entrar no Chat →</button>
        </div>
        <div id="passoMensagem" class="form-etapa escondido">
            <div class="boas-vindas" id="mensagemBoasVindas"></div>
            <textarea id="campoMensagem" rows="3" placeholder="Escreva sua mensagem aqui... 🐸💛"></textarea>
            <button class="btn-principal" onclick="enviarMensagem()">📤 Enviar Mensagem</button>
        </div>
    </div>
    <div class="voltar">
        <a href="primeiroapoio.html">← Voltar para o Mural de Fãs</a>
    </div>

    <script>
        const NOME_ADMIN = "Equipe do Fã Clube 🐸";
        const CAMINHO_MSG = "FãClube/chat/mensagens";
        const CAMINHO_ACESSOS = "FãClube/chat/acessos";
        const CHAVE_ID = "idVisitante_faclube";
        const CHAVE_NOME = "nomeVisitante_faclube";

        function gerarIdUnico() {
            const p1 = Math.random().toString(36).slice(2,6);
            const p2 = Math.random().toString(36).slice(2,6);
            return `fã_${p1}${p2}`;
        }

        let ID_VISITANTE = localStorage.getItem(CHAVE_ID);
        if (!ID_VISITANTE) {
            ID_VISITANTE = gerarIdUnico();
            localStorage.setItem(CHAVE_ID, ID_VISITANTE);
        }
        document.getElementById('exibirMeuId').textContent = ID_VISITANTE;

        let nomeUsuario = localStorage.getItem(CHAVE_NOME) || "";

        function dataAtual() {
            return new Date().toLocaleString('pt-BR', {
                day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
            });
        }

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.onload = async function() {
            const snap = await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).once("value");
            const nomeBanco = snap.val();
            
            if (nomeBanco && nomeBanco.trim() !== "") {
                nomeUsuario = nomeBanco;
                localStorage.setItem(CHAVE_NOME, nomeUsuario);
                entrarNoChat();
            } 
            else if (nomeUsuario && nomeUsuario.trim() !== "") {
                await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).set(nomeUsuario);
                entrarNoChat();
            }
        };

        async function salvarNome() {
            const nome = document.getElementById('nomeChat').value.trim();
            if (!nome) { alert("⚠️ Digite seu nome ou apelido!"); return; }
            
            nomeUsuario = nome;
            localStorage.setItem(CHAVE_NOME, nomeUsuario);
            await db.ref(`${CAMINHO_ACESSOS}/${ID_VISITANTE}/nome`).set(nomeUsuario);
            
            entrarNoChat();
        }

        function entrarNoChat() {
            document.getElementById('passoNome').classList.add('escondido');
            document.getElementById('passoMensagem').classList.remove('escondido');
            document.getElementById('mensagemBoasVindas').innerHTML = `👋 Bem-vindo, <strong>${nomeUsuario}</strong>! 🐸💛<br>Converse com a gente e com outros fãs!`;
            carregarMensagens();
        }

        async function enviarMensagem() {
            const texto = document.getElementById('campoMensagem').value.trim();
            if (!texto) { alert("⚠️ Escreva sua mensagem primeiro!"); return; }
            
            await db.ref(CAMINHO_MSG).push({
                idRemetente: ID_VISITANTE,
                nomeRemetente: nomeUsuario || "Fã Anônimo",
                texto: texto,
                data: dataAtual(),
                resposta: null,
                dataResposta: null
            });
            
            document.getElementById('campoMensagem').value = '';
            alert("✅ Mensagem enviada! Obrigado por participar 🐸💛");
        }

        function carregarMensagens() {
            const area = document.getElementById('areaMensagens');
            db.ref(CAMINHO_MSG).orderByChild("idRemetente").equalTo(ID_VISITANTE).on("value", snap => {
                area.innerHTML = '';
                if (!snap.exists()) {
                    area.innerHTML = '<p class="aviso-vazio">Ainda não tem mensagens 💬<br>Seja o primeiro a falar!</p>';
                    return;
                }
                snap.forEach(item => {
                    const m = item.val();
                    area.innerHTML += `
                        <div class="mensagem mensagem-eu">
                            <div class="bolha">
                                <p class="nome-remetente">${m.nomeRemetente}</p>
                                <p>${m.texto}</p>
                                <p class="data">${m.data}</p>
                            </div>
                        </div>
                    `;
                    if (m.resposta) area.innerHTML += `
                        <div class="mensagem mensagem-resposta">
                            <div class="bolha">
                                <p class="nome-remetente">📩 ${NOME_ADMIN}</p>
                                <p>${m.resposta}</p>
                                <p class="data">${m.dataResposta || ''}</p>
                            </div>
                        </div>
                    `;
                });
                area.scrollTop = area.scrollHeight;
            });
        }
    </script>
</body>
</html>
