<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Vídeo</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: flex-start; /* Alinha para cima */
            justify-content: center;
        }
        .video-wrapper {
            width: 100%;
            max-width: 100vw;
            height: 100vh; /* Ocupa toda a altura da tela */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -15vh; /* ✅ Sobe o vídeo cerca de 15% para esconder a faixa preta */
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video src="videos/SerginhoGoku.mp4" controls playsinline>
            Seu navegador não suporta vídeo.
        </video>
    </div>

</body>
</html>
