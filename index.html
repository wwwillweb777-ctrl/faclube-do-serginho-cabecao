<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fã Clube do Serginho Cabeção 🐸👑</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1208 0%, #2c1e0f 100%);
            background-image: 
                radial-gradient(#3a2a18 1px, transparent 1px),
                radial-gradient(#3a2a18 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
            color: #fff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .cartaz {
            max-width: 450px;
            margin: 0 auto;
            background: #000;
            border-radius: 24px;
            border: 3px solid #f4a900;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(244, 169, 0, 0.25);
            position: relative;
            cursor: pointer; /* Mãozinha aparece indicando que pode clicar */
        }
        .logo-topo {
            width: 100%;
            height: auto;
            display: block;
        }
        .logo-topo img,
        .imagem-principal {
            width: 100%;
            height: auto;
            display: block;
            content-visibility: auto;
            speak: none;
        }

        /* ==============================================================
           📍 COMO MOVER O PLAYER DE MÚSICA
           ==============================================================
           Para ABAIXAR: aumente o valor de "bottom" (ex: 110px, 120px, 150px)
           Para LEVANTAR: diminua o valor de "bottom" (ex: 90px, 70px, 50px)
           Exemplo:
             - Mais embaixo → bottom: 150px;
             - Mais em cima → bottom: 50px;
             - No meio → bottom: 100px;
           ============================================================== */
        .player-musica {
            position: absolute;
            bottom: 100px; /* ← ← ← MUDA ESTE VALOR AQUI! */
            left: 3%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            padding: 0.4rem 0.8rem;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 50px;
            border: 2px solid #f4a900;
            z-index: 10;
        }
        .btn-musica {
            background: #39ff14;
            color: #000;
            border: none;
            padding: 0.35rem 0.6rem;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            min-width: 40px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .volume-display {
            font-size: 0.8rem;
            color: #fff;
            min-width: 38px;
            text-align: center;
        }

        .conteudo-interno {
            padding: 0.5rem 1.5rem 1.5rem;
            text-align: center;
            position: relative;
            z-index: 5;
            background: #000;
        }
        .texto-clique-no {
            font-size: 1.5rem;
            animation: piscarTexto 1.2s infinite alternate;
            color: #ff9900;
        }
        .menu-botao-inferior {
            background: #39ff14;
            color: #000;
            border: none;
            padding: 0.4rem 1rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 12px #39ff14;
            transition: none;
            vertical-align: middle;
            margin-left: 0.4rem;
        }
        .menu-botao-inferior:hover {
            transform: none;
            box-shadow: 0 0 12px #39ff14;
        }
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .menu-overlay.aberto {
            display: flex;
        }
        .menu-conteudo {
            background: #111;
            border: 2px solid #f4a900;
            border-radius: 24px;
            padding: 2.5rem;
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .menu-conteudo h2 {
            color: #f4a900;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }
        .menu-opcao {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 1rem;
            margin-bottom: 0.8rem;
            background: #222;
            border-radius: 12px;
            font-size: 1.1rem;
        }
        .menu-opcao:hover {
            background: #333;
            color: #39ff14;
        }
        .fechar-menu {
            margin-top: 1.5rem;
            background: transparent;
            border: 2px solid #f4a900;
            color: #f4a900;
            padding: 0.7rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
        }
        @keyframes piscarTexto {
            0%   { color: #ff6600;   text-shadow: 0 0 8px #ff6600; }
            100% { color: #ffcc00;   text-shadow: 0 0 8px #ffcc00; }
        }
    </style>
</head>
<body>
    <div class="cartaz" id="areaPrincipal">
        <div class="logo-topo">
            <img src="imagens/LogoSerginho.jpg" alt="">
        </div>

        <img class="imagem-principal" src="imagens/Serginho.jpg" alt="">

        <!-- 🟢 Player de Música -->
        <div class="player-musica" onclick="event.stopPropagation()">
            <button class="btn-musica" onclick="alternarMusica()" id="btnPlayPause">▶️</button>
            <button class="btn-musica" onclick="diminuirVolume()">−</button>
            <span class="volume-display" id="volumeDisplay">50%</span>
            <button class="btn-musica" onclick="aumentarVolume()">+</button>
        </div>

        <!-- ✅ Conteúdo -->
        <div class="conteudo-interno" onclick="event.stopPropagation()">
            <p>
                <span class="texto-clique-no">Clique no</span>
                <button class="menu-botao-inferior" onclick="abrirMenu()">📋 MENU</button>
            </p>
        </div>

        <!-- ✅ ÁUDIO -->
        <audio id="musicaFundo" loop>
            <source src="TamoAiNaAtividade.mp3" type="audio/mpeg">
            Seu navegador não suporta áudio.
        
    </div>

    <div id="menuOverlay" class="menu-overlay">
        <div class="menu-conteudo">
            <h2>🐸 Fã Clube do Serginho Cabeção</h2>
            <a href="chat.html" class="menu-opcao">💬 Conversar / Chat</a>
            <a href="gerenciar.html" class="menu-opcao">🔐 Área Administrativa</a>
            <button class="fechar-menu" onclick="fecharMenu()">✖️ Fechar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCjUBVWJ7f9A8hQXWBhWjLfWxgJ9lhh1YI",
            authDomain: "gabriel-do-corte.firebaseapp.com",
            databaseURL: "https://gabriel-do-corte-default-rtdb.firebaseio.com",
            projectId: "gabriel-do-corte",
            storageBucket: "gabriel-do-corte.firebasestorage.app",
            messagingSenderId: "877270325019",
            appId: "1:877270325019:web:8d75ee1b905a1b8f16a5be"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CHAVE_SESSAO = "sessao_faclube";
        window.onload = async function() {
            if (!sessionStorage.getItem(CHAVE_SESSAO)) {
                sessionStorage.setItem(CHAVE_SESSAO, 'ativa');
                const ref = db.ref("FãClube/visitas");
                const snap = await ref.once("value");
                const total = snap.val() || 0;
                await ref.set(total + 1);
            }
        };

        function abrirMenu() {
            document.getElementById('menuOverlay').classList.add('aberto');
        }
        function fecharMenu() {
            document.getElementById('menuOverlay').classList.remove('aberto');
        }

        // 🟢 Scripts do Player de Música
        const audio = document.getElementById('musicaFundo');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const volumeDisplay = document.getElementById('volumeDisplay');
        const areaPrincipal = document.getElementById('areaPrincipal');
        let estaTocando = false;

        audio.volume = 0.5;

        // ✅ CLICAR EM QUALQUER LUGAR DA IMAGEM → COMEÇA A TOCAR
        areaPrincipal.addEventListener('click', function() {
            if (!estaTocando) {
                audio.play().then(() => {
                    estaTocando = true;
                    btnPlayPause.textContent = '⏸️';
                }).catch(erro => {
                    console.log('Clique no botão de play');
                });
            }
        });

        // ✅ BOTÃO PLAY/PAUSE FUNCIONA NORMALMENTE
        function alternarMusica() {
            if (estaTocando) {
                audio.pause();
                btnPlayPause.textContent = '▶️';
            } else {
                audio.play().catch(erro => {
                    alert('Clique na tela principal para começar! 🎵');
                });
                btnPlayPause.textContent = '⏸️';
            }
            estaTocando = !estaTocando;
        }

        function aumentarVolume() {
            if (audio.volume < 1) {
                audio.volume = Math.min(1, audio.volume + 0.1);
                volumeDisplay.textContent = Math.round(audio.volume * 100) + '%';
            }
        }

        function diminuirVolume() {
            if (audio.volume > 0) {
                audio.volume = Math.max(0, audio.volume - 0.1);
                volumeDisplay.textContent = Math.round(audio.volume * 100) + '%';
            }
        }
    </script>
</body>
</html>
