<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Vídeo</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* ✅ Tela parada — sem rolar! */
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-wrapper {
            width: 100%;
            max-width: 412px;
            aspect-ratio: 9 / 16; /* ✅ Proporção exata vertical */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video src="videos/SerginhoGoku.mp4" controls playsinline>
            Seu navegador não suporta vídeo.
        </video>
    </div>

</body>
</html>
